/* ---- CONDITIONAL LOGIC: job type → which job boxes auto-pull ----
   Rules taken from the sheet + flagged inferences (see chat message). */
function deriveFlags(jt) {
  const isDuctOnly = jt === "Duct System Only";
  const hasDuct = /Duct System/.test(jt);            // includes duct-only
  const hasZone = /Zone System/.test(jt);
  const isGas = /Gas Furnace|Furnace Only|Gas Pack/.test(jt);
  const isMiniSplit = /Mini Split/.test(jt);
  return { isDuctOnly, hasDuct, hasZone, isGas, isMiniSplit };
}
function autoBoxesFor(jt) {
  if (!jt) return new Set();
  const f = deriveFlags(jt);
  const s = new Set();
  if (!f.isDuctOnly) { s.add("Basic Job Box"); s.add("PVC & Copper Job Box"); s.add("Electrical Job Box"); }
  if (f.isGas) s.add("Gas Fitting Job Box");
  if (f.hasDuct) s.add("Duct Material Job Box");
  if (f.hasZone) s.add("Zone System Job Box");
  return s;
}

function App() {
  const [job, setJob] = useState({ jobNo: "", customer: "", address: "", city: "", zip: "", phone: "", installDate: "", notes: "" });
  const [installers, setInstallers] = useState(["", "", "", ""]);
  const [equip, setEquip] = useState({ brand: "", orderDate: "", delivery: "", pickup: "" });

  // portable loaner units to pick up
  const [portables, setPortables] = useState("");
  const [portHeaters, setPortHeaters] = useState("");
  const [portAC, setPortAC] = useState("");

  const [jobType, setJobType] = useState("");
  const [location, setLocation] = useState("");
  const flags = jobType ? deriveFlags(jobType) : {};
  const isAttic = /Attic/.test(location);

  // venting (gas only)
  const [vent, setVent] = useState("");      // "80" | "90"
  const [pvcSize, setPvcSize] = useState("2");
  const [pvcQty, setPvcQty] = useState("");
  const [concentric, setConcentric] = useState("2");
  const [concentricQty, setConcentricQty] = useState("1");

  // ladder
  const [atticLadder, setAtticLadder] = useState("");   // need ladder in attic?
  const [interiorAccess, setInteriorAccess] = useState("");
  const [extLadderNeed, setExtLadderNeed] = useState("");
  const [extLadder, setExtLadder] = useState("");

  // line set
  const [newLineSet, setNewLineSet] = useState("");
  const [lineSetSize, setLineSetSize] = useState(CATALOG.lineSetSizes[1]);

  // gas — LP conversion kit
  const [lpKit, setLpKit] = useState("");
  const [lpKitModel, setLpKitModel] = useState("");

  // disconnect
  const [discIndoor, setDiscIndoor] = useState("");
  const [discOutdoor, setDiscOutdoor] = useState("");

  // electrical: brand(s) + per-item {in,out} quantities
  const [elecBrands, setElecBrands] = useState(["", ""]);
  const [elec, setElec] = useState({}); // { "Title|item": { b1: n, b2: n } }
  const bumpElec = (key, side, delta) => setElec((p) => {
    const cur = { ...(p[key] || { b1: 0, b2: 0 }) };
    cur[side] = Math.max(0, (cur[side] || 0) + delta);
    if (!cur.b1 && !cur.b2) { const n = { ...p }; delete n[key]; return n; }
    return { ...p, [key]: cur };
  });

  const auto = useMemo(() => {
    const s = autoBoxesFor(jobType);
    if (/Gas Furnace|Furnace Only|Gas Pack/.test(jobType) && vent === "90") s.add("90% Furnace PVC Job Box");
    return s;
  }, [jobType, vent]);
  const [extraBoxes, setExtraBoxes] = useState(new Set());

  const [sel, setSel] = useState({});
  const setSingle = (k, v) => setSel((p) => ({ ...p, [k]: p[k] === v ? "" : v }));
  const setQty = (k, item, q) => setSel((p) => {
    const cur = { ...(p[k] || {}) };
    if (q <= 0) delete cur[item]; else cur[item] = q;
    return { ...p, [k]: cur };
  });

  const [video, setVideo] = useState(new Set());
  const toggleVideo = (i) => setVideo((p) => { const n = new Set(p); n.has(i) ? n.delete(i) : n.add(i); return n; });

  /* ---------------- save / load progress ---------------- */
  const collectData = () => ({
    _format: "job-pull-sheet-v1",
    job, installers, equip, portables, portHeaters, portAC,
    jobType, location, vent, pvcSize, pvcQty, concentric, concentricQty,
    atticLadder, interiorAccess, extLadderNeed, extLadder,
    newLineSet, lineSetSize, lpKit, lpKitModel,
    discIndoor, discOutdoor, elecBrands, elec,
    extraBoxes: [...extraBoxes], sel, video: [...video],
  });

  const applyData = (d) => {
    if (!d || d._format !== "job-pull-sheet-v1") return false;
    d.job && setJob(d.job);
    d.installers && setInstallers(d.installers);
    d.equip && setEquip(d.equip);
    setPortables(d.portables || ""); setPortHeaters(d.portHeaters || ""); setPortAC(d.portAC || "");
    setJobType(d.jobType || ""); setLocation(d.location || "");
    setVent(d.vent || ""); setPvcSize(d.pvcSize || "2"); setPvcQty(d.pvcQty || "");
    setConcentric(d.concentric || "2"); setConcentricQty(d.concentricQty || "1");
    setAtticLadder(d.atticLadder || ""); setInteriorAccess(d.interiorAccess || "");
    setExtLadderNeed(d.extLadderNeed || ""); setExtLadder(d.extLadder || "");
    setNewLineSet(d.newLineSet || ""); setLineSetSize(d.lineSetSize || CATALOG.lineSetSizes[1]);
    setLpKit(d.lpKit || ""); setLpKitModel(d.lpKitModel || "");
    setDiscIndoor(d.discIndoor || ""); setDiscOutdoor(d.discOutdoor || "");
    setElecBrands(d.elecBrands || ["", ""]); setElec(d.elec || {});
    setExtraBoxes(new Set(d.extraBoxes || [])); setSel(d.sel || {});
    setVideo(new Set(d.video || []));
    return true;
  };

  // On open, if this file was saved with data baked in, load it.
  useEffect(() => {
    const el = document.getElementById("saved-state");
    if (el && el.textContent.trim() && el.textContent.trim() !== "null") {
      try { applyData(JSON.parse(el.textContent)); } catch { /* ignore */ }
    }
  }, []);

  // Save = rebuild a clean, self-contained HTML file from the pristine
  // source + current data (does NOT photograph the live, running page).
  const saveProgress = () => {
    const data = collectData();
    const source = document.getElementById("app-source")?.textContent || "";
    const safeData = JSON.stringify(data).replace(/</g, "\\u003c");
    const ST = "<" + "/script>"; // avoid closing the outer page's script
    const head =
      '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
      "<title>Job Information & Material Pull Sheet</title>\n" +
      '<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">' + ST + "\n" +
      '<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">' + ST + "\n" +
      '<script src="https://unpkg.com/@babel/standalone/babel.min.js">' + ST + "\n" +
      "<style>html,body,#root{height:100%;margin:0;}</style>\n</head>\n<body>\n" +
      '<div id="root"></div>\n<script id="saved-state" type="application/json">';
    const mid = ST + '\n<script id="app-source" type="text/babel" data-presets="react">';
    const tail = ST + "\n</body>\n</html>";
    const html = head + safeData + mid + source + tail;
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const tag = (job.customer || job.jobNo || "job").replace(/[^a-z0-9]+/gi, "-");
    a.href = url;
    a.download = `Pull-Sheet-${tag}.html`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // Load also accepts an older .json save, for convenience.
  const loadProgress = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        if (!applyData(JSON.parse(reader.result))) alert("That file isn't a saved pull sheet.");
      } catch { alert("Couldn't read that file."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  /* ---------------- pull list ---------------- */
  const pull = useMemo(() => {
    const g = {};
    const add = (grp, item, qty = 1) => { (g[grp] = g[grp] || []).push({ item, qty }); };

    if (jobType) {
      // equipment description echoes the job type
      add("Equipment", jobType);
      if (equip.brand) add("Equipment", `Brand: ${equip.brand}`);
    }

    if (portables === "yes") {
      if (Number(portHeaters) > 0) add("Portables", "Portable Heater", Number(portHeaters));
      if (Number(portAC) > 0) add("Portables", "Portable A/C Unit", Number(portAC));
    }

    [...auto].forEach((b) => add("Job Boxes", b));
    [...extraBoxes].forEach((b) => { if (!auto.has(b)) add("Job Boxes", b); });

    // venting only if gas + a vent box chosen
    if (flags.isGas) {
      if (vent === "80") add("Venting", "B-Vent (see B-Vent job box)");
      if (vent === "90") {
        if (pvcQty) add("Venting", `${pvcSize}" PVC Pipe 10ft`, Number(pvcQty));
        add("Venting", `${concentric}" Concentric Kit`, Math.max(1, Number(concentricQty) || 1));
      }
    }

    if (flags.isGas) add("Gas", "Gas Fitting Job Box");
    if (flags.isGas && lpKit === "yes") add("Gas", `LP Conversion Kit — Model: ${lpKitModel || "★ MODEL NEEDED"}`, 1);

    if (newLineSet === "yes") add("Line Set", `Line Set ${lineSetSize}`, 1);

    SECTIONS.forEach((s) => {
      const v = sel[s.key];
      if (s.mode === "single") { if (v) add(s.group, `${s.title}: ${v}`); }
      else if (v) Object.entries(v).forEach(([item, qty]) => add(s.group, item === s.title ? s.title : `${s.title} ${item}`, qty));
    });

    if (discIndoor && Number(discIndoor) > 0) add("Electrical", "100A SqD Homeline Load Center — Indoor", Number(discIndoor));
    if (discOutdoor && Number(discOutdoor) > 0) add("Electrical", "100A SqD Homeline Load Center — Outdoor", Number(discOutdoor));

    elecBrands.forEach((b, i) => { if (b) add("Electrical", `Breaker Brand${elecBrands.filter(Boolean).length > 1 ? ` ${i + 1}` : ""}: ${b}`); });
    ELEC_SECTIONS.forEach((s) =>
      s.cat && CATALOG[s.cat].forEach((item) => {
        const q = elec[`${s.title}|${item}`];
        const brandSuffix = s.key === "surge"; // surge has its own brand built in
        if (q?.b1 > 0) add("Electrical", `${s.title} ${item}` + (brandSuffix ? "" : ` — ${elecBrands[0] || "Brand 1"}`), q.b1);
        if (q?.b2 > 0) add("Electrical", `${s.title} ${item}` + (brandSuffix ? "" : ` — ${elecBrands[1] || "Brand 2"}`), q.b2);
      })
    );

    if (extLadderNeed === "yes" && extLadder) add("Access / Tools", extLadder, 1);
    if (isAttic && atticLadder === "yes" && interiorAccess && /Ladder/.test(interiorAccess)) add("Access / Tools", interiorAccess, 1);

    return PULL_ORDER.filter((k) => g[k]?.length).map((k) => ({ group: k, items: g[k] }));
  }, [jobType, equip.brand, portables, portHeaters, portAC, auto, extraBoxes, flags, vent, pvcSize, pvcQty, concentric, concentricQty, lpKit, lpKitModel,
    newLineSet, lineSetSize, sel, discIndoor, discOutdoor, elecBrands, elec, extLadderNeed, extLadder, isAttic, atticLadder, interiorAccess]);

  const totalLines = pull.reduce((n, gr) => n + gr.items.length, 0);

  const missing = [];
  if (!jobType) missing.push("job type");
  if (!location) missing.push("equipment location");
  if (flags.isGas && !vent) missing.push("venting (80/90)");
  if (flags.isGas && vent === "90" && !pvcQty) missing.push("PVC qty");
  if (flags.isGas && !lpKit) missing.push("LP kit y/n");
  if (flags.isGas && lpKit === "yes" && !lpKitModel) missing.push("LP kit model #");
  if (isAttic && !atticLadder) missing.push("attic ladder y/n");
  if (!extLadderNeed) missing.push("extension ladder y/n");
  if (!newLineSet) missing.push("new line set y/n");

  const grouped = useMemo(() => {
    const out = {};
    SECTIONS.forEach((s) => { (out[s.group] = out[s.group] || []).push(s); });
    return out;
  }, []);

  return (
    <div style={S.page}>
      <style>{CSS}</style>
      <header style={S.topbar} className="no-print">
        <div style={S.brand}><span style={S.mark}>▲</span>JOB PLANNING &amp; MATERIAL PULL</div>
        <span style={S.sub}>Conditional Logic Build Sheet</span>
      </header>

      <div style={S.grid} className="layout-grid">
        {/* ============ LEFT: INPUTS ============ */}
        <section style={S.col} className="no-print">

          <Block n="1" title="Job Information">
            <Row>
              <Field l="Job #"><input style={S.in} value={job.jobNo} onChange={(e) => setJob({ ...job, jobNo: e.target.value })} /></Field>
              <Field l="Install Date"><input style={S.in} type="date" value={job.installDate} onChange={(e) => setJob({ ...job, installDate: e.target.value })} /></Field>
            </Row>
            <Row>
              <Field l="Customer"><input style={S.in} value={job.customer} onChange={(e) => setJob({ ...job, customer: e.target.value })} /></Field>
              <Field l="Phone"><input style={S.in} value={job.phone} onChange={(e) => setJob({ ...job, phone: e.target.value })} /></Field>
            </Row>
            <Row>
              <Field l="Address"><input style={S.in} value={job.address} onChange={(e) => setJob({ ...job, address: e.target.value })} /></Field>
            </Row>
            <Row>
              <Field l="City"><input style={S.in} value={job.city} onChange={(e) => setJob({ ...job, city: e.target.value })} /></Field>
              <Field l="Zip"><input style={S.in} value={job.zip} onChange={(e) => setJob({ ...job, zip: e.target.value })} /></Field>
            </Row>
            <Row>
              {installers.map((v, i) => (
                <Field key={i} l={`Installer ${i + 1}`}>
                  <select style={S.in} value={v} onChange={(e) => { const n = [...installers]; n[i] = e.target.value; setInstallers(n); }}>
                    <option value="">—</option>
                    <optgroup label="Mechanics">{MECHANICS.map((m) => <option key={m}>{m}</option>)}</optgroup>
                    <optgroup label="Helpers">{HELPERS.map((m) => <option key={m}>{m}</option>)}</optgroup>
                  </select>
                </Field>
              ))}
            </Row>
            <div style={S.subBox}>
              <Field l="Any portable heaters or portable A/C units to pick up?">
                <Pills v={portables} set={setPortables} opts={[{ v: "yes", l: "Yes" }, { v: "no", l: "No" }]} />
              </Field>
              {portables === "yes" && (
                <Row>
                  <Field l="Portable Heaters QTY"><input style={S.in} type="number" min="0" value={portHeaters} onChange={(e) => setPortHeaters(e.target.value)} /></Field>
                  <Field l="Portable A/C QTY"><input style={S.in} type="number" min="0" value={portAC} onChange={(e) => setPortAC(e.target.value)} /></Field>
                </Row>
              )}
            </div>
            <Field l="Job Notes"><textarea style={{ ...S.in, minHeight: 50, resize: "vertical" }} value={job.notes} onChange={(e) => setJob({ ...job, notes: e.target.value })} /></Field>
          </Block>

          <Block n="2" title="Equipment & Logistics">
            <Row>
              <Field l="Equipment Brand">
                <select style={S.in} value={equip.brand} onChange={(e) => setEquip({ ...equip, brand: e.target.value })}>
                  <option value="">—</option>{EQUIP_BRANDS.map((b) => <option key={b}>{b}</option>)}
                </select>
              </Field>
              <Field l="Date Ordered"><input style={S.in} type="date" value={equip.orderDate} onChange={(e) => setEquip({ ...equip, orderDate: e.target.value })} /></Field>
            </Row>
            <Field l="Delivery">
              <Pills v={equip.delivery} set={(x) => setEquip({ ...equip, delivery: x })}
                opts={["Shop by 8am", "Job site", "At shop", "Installer pickup"]} wrap />
            </Field>
            {equip.delivery === "Installer pickup" && (
              <Field l="Pickup Location">
                <select style={S.in} value={equip.pickup} onChange={(e) => setEquip({ ...equip, pickup: e.target.value })}>
                  <option value="">—</option>{PICKUP_LOCATIONS.map((p) => <option key={p}>{p}</option>)}
                </select>
              </Field>
            )}
          </Block>

          <Block n="3" title="Job Type ▸ drives job boxes">
            <select style={S.in} value={jobType} onChange={(e) => setJobType(e.target.value)}>
              <option value="">— Select job type —</option>
              {JOB_TYPES.map((t) => <option key={t}>{t}</option>)}
            </select>
            {jobType && (
              <div style={S.auto}>
                ✔ Auto-pulls: {[...auto].join(", ")}
                {flags.isGas && <div style={S.flag}>⚑ Gas job — pick venting in step 5</div>}
              </div>
            )}
          </Block>

          <Block n="4" title="Equipment Location">
            <select style={S.in} value={location} onChange={(e) => setLocation(e.target.value)}>
              <option value="">— Select location —</option>
              {LOCATIONS.map((l) => <option key={l}>{l}</option>)}
            </select>
            {isAttic && (
              <div style={S.subBox}>
                <Field l="Attic install — do we need a ladder?">
                  <Pills v={atticLadder} set={setAtticLadder} opts={[{ v: "yes", l: "Yes" }, { v: "no", l: "No" }]} />
                </Field>
                {atticLadder === "yes" && (
                  <Field l="Access type / ladder size">
                    <Pills v={interiorAccess} set={setInteriorAccess} opts={INTERIOR_ACCESS} wrap />
                  </Field>
                )}
              </div>
            )}
          </Block>

          {flags.isGas && (
            <Block n="5" title="Venting (gas)">
              <Pills v={vent} set={setVent} opts={[{ v: "80", l: "80% — B-Vent" }, { v: "90", l: "90% — PVC" }]} />
              {vent === "80" && <div style={S.auto}>Add a B-Vent job box in step 7 (Metal Fab or Hart &amp; Cooley)</div>}
              {vent === "90" && (
                <div style={S.subBox}>
                  <div style={S.auto}>✔ Pulls 90% Furnace PVC Job Box + add-ons</div>
                  <Field l="PVC pipe size"><Pills v={pvcSize} set={setPvcSize} opts={["2", "3"]} suf='"' /></Field>
                  <Field l="PVC qty (10ft sticks)"><input style={S.in} type="number" min="0" value={pvcQty} onChange={(e) => setPvcQty(e.target.value)} /></Field>
                  <Row>
                    <Field l="Concentric kit"><Pills v={concentric} set={setConcentric} opts={["2", "3"]} suf='"' /></Field>
                    <Field l="Concentric QTY"><input style={S.in} type="number" min="1" value={concentricQty} onChange={(e) => setConcentricQty(e.target.value)} /></Field>
                  </Row>
                </div>
              )}
              <div style={S.subBox}>
                <Field l="Does it need an LP Kit?">
                  <Pills v={lpKit} set={setLpKit} opts={[{ v: "yes", l: "Yes" }, { v: "no", l: "No" }]} />
                </Field>
                {lpKit === "yes" && (
                  <>
                    <Field l="LP Kit model # (to pull / order)">
                      <input style={S.in} value={lpKitModel} onChange={(e) => setLpKitModel(e.target.value)} placeholder="Enter model number" />
                    </Field>
                    <div style={S.auto}>✔ Pulls: LP Conversion Kit{lpKitModel ? ` — ${lpKitModel}` : ""}</div>
                  </>
                )}
              </div>
            </Block>
          )}

          <Block n="6" title="Line Set & Extension Ladder">
            <Field l="Running a new line set?">
              <Pills v={newLineSet} set={setNewLineSet} opts={[{ v: "yes", l: "Yes" }, { v: "no", l: "No" }]} />
            </Field>
            {newLineSet === "yes" && (
              <Field l="Line set size">
                <select style={S.in} value={lineSetSize} onChange={(e) => setLineSetSize(e.target.value)}>
                  {CATALOG.lineSetSizes.map((o) => <option key={o}>{o}</option>)}
                </select>
              </Field>
            )}
            <Field l="Need an extension ladder?">
              <Pills v={extLadderNeed} set={setExtLadderNeed} opts={[{ v: "yes", l: "Yes" }, { v: "no", l: "No" }]} />
            </Field>
            {extLadderNeed === "yes" && (
              <Field l="Extension ladder size"><Pills v={extLadder} set={setExtLadder} opts={EXT_LADDERS} wrap /></Field>
            )}
          </Block>

          <Block n="7" title="Job Boxes">
            <div style={S.chkGrid}>
              {CATALOG.jobBoxes.map((b) => {
                const locked = auto.has(b);
                const checked = locked || extraBoxes.has(b);
                return (
                  <label key={b} style={{ ...S.chk, opacity: locked ? 0.85 : 1 }}>
                    <input type="checkbox" checked={checked} disabled={locked}
                      onChange={(e) => setExtraBoxes((p) => { const n = new Set(p); e.target.checked ? n.add(b) : n.delete(b); return n; })} />
                    {b}{locked && <span style={S.lockTag}>auto</span>}
                  </label>
                );
              })}
            </div>
          </Block>

          <Block n="8" title="Disconnect / Load Center">
            <Row>
              <Field l="Indoor QTY"><input style={S.in} type="number" min="0" value={discIndoor} onChange={(e) => setDiscIndoor(e.target.value)} /></Field>
              <Field l="Outdoor QTY"><input style={S.in} type="number" min="0" value={discOutdoor} onChange={(e) => setDiscOutdoor(e.target.value)} /></Field>
            </Row>
          </Block>

          <Block n="9" title="Electrical — Brand 1 / Brand 2">
            <Row>
              {elecBrands.map((v, i) => (
                <Field key={i} l={`Breaker Brand ${i + 1}`}>
                  <select style={S.in} value={v} onChange={(e) => { const n = [...elecBrands]; n[i] = e.target.value; setElecBrands(n); }}>
                    <option value="">—</option>{CATALOG.breakerBrands.map((b) => <option key={b}>{b}</option>)}
                  </select>
                </Field>
              ))}
            </Row>
            {ELEC_SECTIONS.map((s) => (
              <div key={s.key} style={S.secWrap}>
                <div style={S.elecHead}>
                  <span>{s.title}</span>
                  <span style={S.elecCols}>
                    <span>{elecBrands[0] ? elecBrands[0].split(" ")[0] : "BR 1"}</span>
                    <span>{elecBrands[1] ? elecBrands[1].split(" ")[0] : "BR 2"}</span>
                  </span>
                </div>
                {CATALOG[s.cat].map((item) => {
                  const q = elec[`${s.title}|${item}`] || { b1: 0, b2: 0 };
                  const on = q.b1 || q.b2;
                  return (
                    <div key={item} style={{ ...S.elecRow, ...(on ? S.qtyOn : {}) }}>
                      <span style={S.elecLbl}>{item}</span>
                      <Stepper q={q.b1} onMinus={() => bumpElec(`${s.title}|${item}`, "b1", -1)} onPlus={() => bumpElec(`${s.title}|${item}`, "b1", 1)} />
                      <Stepper q={q.b2} onMinus={() => bumpElec(`${s.title}|${item}`, "b2", -1)} onPlus={() => bumpElec(`${s.title}|${item}`, "b2", 1)} />
                    </div>
                  );
                })}
              </div>
            ))}
          </Block>


          {Object.entries(grouped).map(([group, secs]) => (
            <Block key={group} n="•" title={group} collapsible>
              {secs.map((s) => (
                <div key={s.key} style={S.secWrap}>
                  <div style={S.secTitle}>{s.title}</div>
                  {s.mode === "single"
                    ? <Pills v={sel[s.key] || ""} set={(val) => setSingle(s.key, val)} opts={CATALOG[s.cat]} wrap />
                    : <div style={S.qtyGrid}>{CATALOG[s.cat].map((item) => {
                        const q = (sel[s.key] || {})[item] || 0;
                        return (
                          <div key={item} style={{ ...S.qtyItem, ...(q ? S.qtyOn : {}) }}>
                            <button style={S.step} onClick={() => setQty(s.key, item, q - 1)}>−</button>
                            <span style={S.qtyN}>{q}</span>
                            <button style={S.step} onClick={() => setQty(s.key, item, q + 1)}>+</button>
                            <span style={S.qtyLbl}>{item}</span>
                          </div>);
                      })}</div>}
                </div>
              ))}
            </Block>
          ))}

          <Block n="9" title="What's Needed in Video" collapsible>
            {Object.entries(VIDEO_CHECKLIST).map(([cat, items]) => (
              <div key={cat} style={S.secWrap}>
                <div style={S.secTitle}>{cat}</div>
                <div style={S.chkGrid}>
                  {items.map((it) => {
                    const id = cat + "|" + it;
                    return <label key={id} style={S.chk}><input type="checkbox" checked={video.has(id)} onChange={() => toggleVideo(id)} />{it}</label>;
                  })}
                </div>
              </div>
            ))}
          </Block>
        </section>

        {/* ============ RIGHT: OUTPUT SHEET ============ */}
        <section style={S.sheet} className="sheet-panel">
          <div style={S.sheetHead}>
            <div>
              <div style={S.sheetTitle}>JOB INFORMATION &amp; MATERIAL PULL SHEET</div>
              <div style={S.meta}>
                Job #{job.jobNo || "—"} · {job.customer || "—"}<br />
                {job.address || "—"}{job.city ? `, ${job.city}` : ""} {job.zip}<br />
                {jobType || "no job type"} · {location || "no location"}<br />
                Install {job.installDate || "—"} · {equip.brand || "—"} · {totalLines} line items<br />
                Crew: {installers.filter(Boolean).join(", ") || "—"}
              </div>
            </div>
            <div style={S.btnRow} className="no-print">
              <button style={S.saveBtn} onClick={saveProgress}>💾 Save</button>
              <label style={S.loadBtn}>📂 Load
                <input type="file" accept="application/json,.json" onChange={loadProgress} style={{ display: "none" }} />
              </label>
              <button style={S.print} onClick={() => window.print()}>⎙ Print</button>
            </div>
          </div>

          {missing.length > 0 && <div style={S.warn} className="no-print">Still needed: {missing.join(", ")}.</div>}

          <div style={S.secLabel}>▣ WAREHOUSE — PULL LIST</div>
          {pull.length === 0 && <div style={S.empty}>Pick a job type to start building the list.</div>}
          {pull.map((g) => (
            <div key={g.group} style={S.pg}>
              <div style={S.pgTitle}>{g.group}</div>
              {g.items.map((it, i) => (
                <div key={it.item + i} style={S.pi}>
                  <span style={S.box}>☐</span><span style={S.qtyChip}>{it.qty}</span><span>{it.item}</span>
                </div>
              ))}
            </div>
          ))}

          <div style={{ ...S.secLabel, marginTop: 18 }}>▣ INSTALLER JOB SPEC</div>
          <div style={S.spec}>
            <SL k="Job Type" v={jobType || "—"} />
            <SL k="Location" v={location || "—"} />
            <SL k="Brand" v={equip.brand || "—"} />
            <SL k="Venting" v={!flags.isGas ? "n/a" : vent === "80" ? "80% B-Vent" : vent === "90" ? `90% PVC ${pvcSize}" ×${pvcQty || "?"} + ${concentric}" conc. ×${concentricQty || 1}` : "—"} />
            <SL k="LP Kit" v={!flags.isGas ? "n/a" : lpKit === "yes" ? `Yes${lpKitModel ? ` — ${lpKitModel}` : " (model?)"}` : lpKit === "no" ? "No" : "—"} />
            <SL k="Line Set" v={newLineSet === "yes" ? lineSetSize : newLineSet === "no" ? "Reuse existing" : "—"} />
            <SL k="Attic Access" v={isAttic ? (atticLadder === "yes" ? interiorAccess || "ladder needed" : "no ladder") : "n/a"} />
            <SL k="Ext. Ladder" v={extLadderNeed === "yes" ? extLadder || "yes" : "no"} />
            <SL k="Thermostat" v={sel.thermostats || "—"} />
            <SL k="Portables" v={portables !== "yes" ? "None" : (() => {
              const parts = [];
              if (Number(portHeaters) > 0) parts.push(`${portHeaters} Portable Heater${Number(portHeaters) > 1 ? "s" : ""}`);
              if (Number(portAC) > 0) parts.push(`${portAC} Portable A/C${Number(portAC) > 1 ? " units" : ""}`);
              return parts.length ? "Pick up: " + parts.join(", ") : "Yes (qty?)";
            })()} />
            <SL k="Delivery" v={equip.delivery ? equip.delivery + (equip.pickup ? ` (${equip.pickup})` : "") : "—"} />
          </div>

          {video.size > 0 && (
            <>
              <div style={{ ...S.secLabel, marginTop: 18 }}>▣ VIDEO / PHOTO CHECKLIST</div>
              <div style={S.spec}>
                {[...video].map((id) => {
                  const [cat, it] = id.split("|");
                  return <div key={id} style={S.pi}><span style={S.box}>☐</span><span style={{ color: "#9a968c", fontSize: 11 }}>{cat}</span> {it}</div>;
                })}
              </div>
            </>
          )}

          {job.notes && (<><div style={{ ...S.secLabel, marginTop: 18 }}>▣ JOB NOTES</div><div style={S.notesBox}>{job.notes}</div></>)}
        </section>
      </div>
    </div>
  );
}

/* ---------- components ---------- */
const Block = ({ n, title, children, collapsible }) => {
  const [open, setOpen] = useState(!collapsible);
  return (
    <div style={S.block}>
      <div style={S.bHead} onClick={collapsible ? () => setOpen(!open) : undefined}>
        <span style={S.bNum}>{n}</span>{title}{collapsible && <span style={S.caret}>{open ? "▾" : "▸"}</span>}
      </div>
      {open && children}
    </div>
  );
};
const Row = ({ children }) => <div style={S.row}>{children}</div>;
const Stepper = ({ q, onMinus, onPlus }) => (
  <span style={S.stepper}>
    <button style={S.step} onClick={onMinus}>−</button>
    <span style={S.qtyN}>{q}</span>
    <button style={S.step} onClick={onPlus}>+</button>
  </span>
);
const Field = ({ l, children }) => <label style={S.field}><span style={S.fl}>{l}</span>{children}</label>;
const SL = ({ k, v }) => <div style={S.sl}><span style={S.slk}>{k}</span><span style={S.slv}>{v}</span></div>;
const Pills = ({ v, set, opts, suf = "", wrap }) => (
  <div style={S.pills}>
    {opts.map((o) => {
      const val = typeof o === "string" ? o : o.v;
      const lbl = typeof o === "string" ? o + suf : o.l;
      const on = v === val;
      return <button key={val} onClick={() => set(val)} style={{ ...S.pill, ...(on ? S.pillOn : {}) }}>{lbl}</button>;
    })}
  </div>
);

/* ---------- styles ---------- */
const ink = "#16191d", amber = "#f6a821", paper = "#fbfaf7", line = "#d8d4cc", muted = "#6b6962";
const S = {
  page: { fontFamily: "'Archivo',sans-serif", color: ink, background: "#eceae4", minHeight: "100%" },
  topbar: { display: "flex", justifyContent: "space-between", alignItems: "center", background: ink, color: paper, padding: "14px 22px" },
  brand: { fontFamily: "'Oswald',sans-serif", fontWeight: 600, letterSpacing: ".11em", fontSize: 17, display: "flex", gap: 10, alignItems: "center" },
  mark: { color: amber }, sub: { fontFamily: "'JetBrains Mono',monospace", fontSize: 11, color: "#9a978f" },
  grid: { display: "grid", gridTemplateColumns: "minmax(340px,1.15fr) minmax(300px,.85fr)", alignItems: "start" },
  col: { padding: 20, display: "flex", flexDirection: "column", gap: 12 },
  block: { background: paper, border: `1px solid ${line}`, borderRadius: 4, padding: "12px 14px" },
  bHead: { fontFamily: "'Oswald',sans-serif", fontWeight: 600, letterSpacing: ".05em", textTransform: "uppercase", fontSize: 13.5, display: "flex", alignItems: "center", gap: 10 },
  bNum: { background: ink, color: amber, minWidth: 22, height: 22, borderRadius: 3, display: "grid", placeItems: "center", fontSize: 12, fontFamily: "'JetBrains Mono',monospace" },
  caret: { marginLeft: "auto", color: muted, cursor: "pointer" },
  row: { display: "flex", gap: 10, flexWrap: "wrap", marginTop: 10 },
  field: { display: "flex", flexDirection: "column", gap: 5, flex: 1, minWidth: 120, marginTop: 10 },
  fl: { fontSize: 11, textTransform: "uppercase", letterSpacing: ".05em", color: muted, fontWeight: 600 },
  in: { fontFamily: "'JetBrains Mono',monospace", fontSize: 13, padding: "8px 10px", border: `1px solid ${line}`, borderRadius: 3, background: "#fff", color: ink, outline: "none", width: "100%" },
  pills: { display: "flex", gap: 7, flexWrap: "wrap", marginTop: 8 },
  pill: { fontFamily: "'Oswald',sans-serif", letterSpacing: ".03em", fontSize: 12.5, padding: "7px 12px", border: `1px solid ${line}`, borderRadius: 3, background: "#fff", color: ink, cursor: "pointer" },
  pillOn: { background: ink, color: amber, borderColor: ink },
  auto: { fontFamily: "'JetBrains Mono',monospace", fontSize: 12, color: "#3a7a3a", marginTop: 8, lineHeight: 1.5 },
  flag: { color: "#8a6a14", marginTop: 4 },
  subBox: { marginTop: 10, paddingTop: 10, borderTop: `1px dashed ${line}` },
  chk: { display: "flex", alignItems: "center", gap: 7, fontSize: 12.5, fontFamily: "'JetBrains Mono',monospace", marginTop: 7, cursor: "pointer" },
  chkGrid: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 4, marginTop: 8 },
  lockTag: { fontSize: 9, background: amber, color: ink, padding: "1px 5px", borderRadius: 2, marginLeft: 4, fontWeight: 700 },
  secWrap: { marginTop: 12 },
  secTitle: { fontFamily: "'Oswald',sans-serif", fontSize: 12, textTransform: "uppercase", letterSpacing: ".06em", color: muted, borderBottom: `1px solid ${line}`, paddingBottom: 3 },
  qtyGrid: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 5, marginTop: 8 },
  qtyItem: { display: "flex", alignItems: "center", gap: 5, border: `1px solid ${line}`, borderRadius: 3, padding: "3px 5px", background: "#fff" },
