/* ---- CONDITIONAL LOGIC: job type → which job boxes auto-pull ----
   Rules taken from the sheet + flagged inferences (see chat message). */
function deriveFlags(jt) {
  const isDuctOnly = jt === "Duct System Only";
  const hasDuct = /Duct System/.test(jt);            // includes duct-only
  const hasZone = /Zone System/.test(jt);
  const isGas = /Gas Furnace|Furnace Only|Gas Pack/.test(jt);
  const isGasPack = /Gas Pack/.test(jt);             // vents through its own flue — no 80/90 or PVC
  const isMiniSplit = /Mini Split/.test(jt);
  return { isDuctOnly, hasDuct, hasZone, isGas, isGasPack, isMiniSplit };
}
function autoBoxesFor(jt) {
  if (!jt) return new Set();
  const f = deriveFlags(jt);
  const s = new Set();
  if (!f.isDuctOnly) { s.add("Basic Job Box"); s.add("PVC & Copper Job Box"); s.add("Electrical Job Box"); }
  if (f.isGas) s.add("Gas Fitting Job Box");
  if (f.hasDuct) s.add("Duct Material Job Box");
  if (f.hasZone) s.add("Zone System Job Box");
  return s;
}

// Which equipment pieces need a model/serial recorded by the warehouse.
function equipmentUnitsFor(jt) {
  if (!jt) return [];
  if (/Duct System Only/.test(jt)) return [];
  if (/Mini Split/.test(jt)) return ["Indoor Head Unit", "Outdoor Condenser"];
  if (/Package Heat Pump/.test(jt)) return ["Package Unit", "Heat Strip"];
  if (/Gas Pack/.test(jt)) return ["Package Unit"];
  const units = [];
  if (/Modular Home Electric Furnace/.test(jt)) { units.push("Electric Furnace", "Evaporator Coil", "Condenser"); return units; }
  if (/Gas Furnace|Furnace Only/.test(jt)) units.push("Furnace");
  if (/Heat Pump/.test(jt)) units.push("Air Handler");
  if (/Coil/.test(jt) || /Gas Furnace/.test(jt)) units.push("Evaporator Coil");
  if (/Condenser|Heat Pump/.test(jt)) units.push("Condenser");
  if (/Heat Pump/.test(jt)) units.push("Heat Strip");
  // Fallback for any change-out that didn't match specifics
  return units.length ? units : ["Indoor Unit", "Outdoor Unit"];
}

  { key: "reducer", title: "Reducer", cat: "reducer", mode: "multi", group: "Fittings", special: true },
  { key: "endCap", title: "End Cap", cat: "endCap", mode: "multi", group: "Fittings" },
  { key: "saddleCollar", title: "Saddle Collar", cat: "saddleCollar", mode: "multi", group: "Fittings" },
  { key: "aCollar", title: "A Collar", cat: "aCollar", mode: "multi", group: "Fittings" },
  { key: "iaq", title: "IAQ", cat: "iaq", mode: "multi", group: "Air Quality", special: true },
  { key: "mediaCleaner", title: "Media Air Cleaner", cat: "mediaCleaner", mode: "multi", group: "Air Quality", special: true },
  { key: "lineSetFittings", title: "Line Set Cover & Fittings", cat: "lineSetFittings", mode: "multi", group: "Line Set" },
  { key: "misc", title: "Misc Material", cat: "misc", mode: "multi", group: "Misc", special: true, specialCount: 4 },
  { key: "block", title: "Block / Brick", cat: "block", mode: "multi", group: "Misc", special: true },
];

const PULL_ORDER = ["Equipment", "Portables", "Job Boxes", "Venting", "Gas", "Line Set", "Controls", "Equipment Support",
  "Air Distribution", "Ductwork", "Fittings", "Electrical", "Air Quality", "Misc", "Access / Tools"];

// Electrical items get separate Indoor + Outdoor quantities
const ELEC_SECTIONS = [
  { key: "breakerDouble", title: "Breaker Double Pole", cat: "breakerDouble" },
  { key: "breakerSingle", title: "Breaker Single Pole", cat: "breakerSingle" },
  { key: "tandem", title: "Tandem Breaker", cat: "tandem" },
  { key: "surge", title: "Surge Protector", cat: "surge" },
];

// Normalize floor grill qty to { brown, white } even if older saved data stored it as a plain number.
const normFloor = (f) => (f && typeof f === "object") ? { brown: f.brown || 0, white: f.white || 0 } : { brown: f || 0, white: 0 };

// Blank starting state for one system (one unit / one install crew) within a job.
const makeBlankSystem = (label) => ({
  label: label || "System 1",
  pm: { needElectrician: "", electricianDateSet: "", keepOldEquip: "", keepOldNote: "", videosUploaded: "" },
  installers: ["", "", "", ""],
  equip: { brand: "", orderDate: "", delivery: "", pickup: "" },
  portables: "", portHeaters: "", portAC: "", portSource: "",
  jobType: "", location: "",
  vent: "", pvcQty: { "2": "", "3": "" }, concentric: "2", concentricQty: "1",
  atticLadder: "", interiorAccess: "", extLadderNeed: "", extLadder: "",
  newLineSet: "", lineSetSize: CATALOG.lineSetSizes[1],
  lpKit: "", lpKitModel: "",
  discIndoor: "", discOutdoor: "",
  elecBrands: ["", ""], elec: {},
  supplyG: {}, supplyGSpecial: ["", ""],
  ductWizard: null, lastKit: null,
  extraBoxes: new Set(),
  zoneControl: "", zoneDampers: {}, damperModel: "",
  sel: {}, special: {},
  video: new Set(),
  handoff: "",
  notes: "",
  ductDefaulted: false,
});

// Build the warehouse pull list for a single system (pure function of that system's data).
function buildPull(sys) {
  const flags = deriveFlags(sys.jobType || "");
  const auto = autoBoxesFor(sys.jobType || "");
  if (/Gas Furnace|Furnace Only|Gas Pack/.test(sys.jobType || "") && sys.vent === "90") auto.add("90% Furnace PVC Job Box");
  const zoneActive = auto.has("Zone System Job Box") || sys.extraBoxes.has("Zone System Job Box");
  const isAttic = /Attic/.test(sys.location || "");

  const g = {};
  const add = (grp, item, qty = 1) => { (g[grp] = g[grp] || []).push({ item, qty }); };
  const withPart = (sectionKey, size, label) => {
    const pn = (PART_NUMBERS_BY_SECTION[sectionKey] && PART_NUMBERS_BY_SECTION[sectionKey][size]) || PART_NUMBERS[size];
    return pn ? `${label} (${pn})` : label;
  };

  if (sys.jobType) {
    add("Equipment", sys.jobType);
    if (sys.equip.brand) add("Equipment", `Brand: ${sys.equip.brand}`);
  }

  if (sys.portables === "yes") {
    const tag = sys.portSource === "Pick up from job" ? " — crew picks up from job (do NOT pull)" : "";
    if (Number(sys.portHeaters) > 0) add("Portables", `Portable Heater${tag}`, Number(sys.portHeaters));
    if (Number(sys.portAC) > 0) add("Portables", `Portable A/C Unit${tag}`, Number(sys.portAC));
  }

  [...auto].forEach((b) => add("Job Boxes", b));
  [...sys.extraBoxes].forEach((b) => { if (!auto.has(b)) add("Job Boxes", b); });

  if (zoneActive) {
    if (sys.zoneControl) add("Controls", `Zone Control: ${sys.zoneControl}`);
    if (sys.damperModel) add("Controls", `Damper Model: ${sys.damperModel}`);
    Object.entries(sys.zoneDampers).forEach(([size, q]) => add("Controls", `Zone Damper ${size}`, q));
  }

  if (flags.isGas) {
    if (sys.vent === "80") add("Venting", "B-Vent (see B-Vent job box)");
    if (sys.vent === "90") {
      ["2", "3"].forEach((size) => {
        const q = Number(sys.pvcQty[size]) || 0;
        if (q > 0) add("Venting", withPart("pvcAddon", `${size}" PVC Pipe 10ft`, `${size}" PVC Pipe 10ft`), q);
      });
      if (sys.concentric !== "none") {
        add("Venting", withPart("concentric", `${sys.concentric}" Concentric Kit`, `${sys.concentric}" Concentric Kit`), Math.max(1, Number(sys.concentricQty) || 1));
      }
    }
  }

  if (flags.isGas) add("Gas", "Gas Fitting Job Box");
  if (flags.isGas && sys.lpKit === "yes") add("Gas", `LP Conversion Kit — Model: ${sys.lpKitModel || "★ MODEL NEEDED"}`, 1);

  if (sys.newLineSet === "yes") add("Line Set", withPart("lineSetSizes", sys.lineSetSize, `Line Set ${sys.lineSetSize}`), 1);

  SECTIONS.forEach((s) => {
    const v = sys.sel[s.key];
    if (s.mode === "single") { if (v) add(s.group, withPart(s.key, v, `${s.title}: ${v}`)); }
    else if (v) Object.entries(v).forEach(([item, qty]) => add(s.group, item === s.title ? withPart(s.key, item, s.title) : withPart(s.key, item, `${s.title} ${item}`), qty));
    if (s.special) (sys.special[s.key] || []).forEach((txt) => { if (txt?.trim()) add(s.group, `${s.title} — Special ${s.key === "thermostats" ? "model" : "size"}: ${txt.trim()}`, 1); });
  });

  Object.entries(sys.supplyG).forEach(([size, qs]) => {
    const floor = normFloor(qs.floor);
    if (floor.brown > 0) add("Air Distribution", `Supply Grill ${size} — Floor (Brown)`, floor.brown);
    if (floor.white > 0) add("Air Distribution", `Supply Grill ${size} — Floor (White)`, floor.white);
    if (qs.ceiling > 0) add("Air Distribution", `Supply Grill ${size} — Ceiling`, qs.ceiling);
  });
  sys.supplyGSpecial.forEach((txt) => { if (txt?.trim()) add("Air Distribution", `Supply Grill — Special size: ${txt.trim()}`, 1); });

  if (sys.discIndoor && Number(sys.discIndoor) > 0) add("Electrical", "100 Amp Square D Homeline 6 Spaces 12 Circuit Main Lug Load Center — Indoor", Number(sys.discIndoor));
  if (sys.discOutdoor && Number(sys.discOutdoor) > 0) add("Electrical", "100 Amp Square D Homeline 6 Spaces 12 Circuit Main Lug Load Center — Outdoor", Number(sys.discOutdoor));

  sys.elecBrands.forEach((b, i) => { if (b) add("Electrical", `Breaker Brand${sys.elecBrands.filter(Boolean).length > 1 ? ` ${i + 1}` : ""}: ${b}`); });
  ELEC_SECTIONS.forEach((s) =>
    s.cat && CATALOG[s.cat].forEach((item) => {
      const q = sys.elec[`${s.title}|${item}`];
      const brandSuffix = s.key === "surge";
      if (q?.b1 > 0) add("Electrical", withPart(s.key, item, `${s.title} ${item}`) + (brandSuffix ? "" : ` — ${sys.elecBrands[0] || "Brand 1"}`), q.b1);
      if (q?.b2 > 0) add("Electrical", withPart(s.key, item, `${s.title} ${item}`) + (brandSuffix ? "" : ` — ${sys.elecBrands[1] || "Brand 2"}`), q.b2);
    })
  );

  if (sys.extLadderNeed === "yes" && sys.extLadder) add("Access / Tools", sys.extLadder, 1);
  if (isAttic && sys.atticLadder === "yes" && sys.interiorAccess && /Ladder/.test(sys.interiorAccess)) add("Access / Tools", sys.interiorAccess, 1);

  return PULL_ORDER.filter((k) => g[k]?.length).map((k) => ({ group: k, items: g[k] }));
}

function App() {
  const [job, setJob] = useState({ jobNo: "", customer: "", address: "", city: "", state: "", zip: "", phone: "", installDate: "" });

  // In-page confirm dialog. Browser-native window.confirm()/alert() get silently
  // blocked in sandboxed preview environments, so destructive/blocking actions
  // route through this instead of relying on them.
  const [confirmDialog, setConfirmDialog] = useState(null); // { message, onConfirm } | { message, onConfirm: null } for a plain notice
  const askConfirm = (message, onConfirm) => setConfirmDialog({ message, onConfirm });

  // ---- Multiple systems (e.g. 1st Floor unit / 2nd Floor unit) within one job ----
  const [systems, setSystemsRaw] = useState(() => [makeBlankSystem("System 1")]);
  const [activeIdx, setActiveIdxRaw] = useState(0);
  const activeSystem = systems[Math.min(activeIdx, systems.length - 1)];

  const updateSystemAt = (idx, updater) => setSystemsRaw((prev) => prev.map((s, i) => (i === idx ? (typeof updater === "function" ? updater(s) : updater) : s)));
  // Gives every per-system field a familiar [value, setValue] pair, backed by the active system.
  const sysState = (key) => [
    activeSystem[key],
    (updater) => updateSystemAt(activeIdx, (s) => ({ ...s, [key]: typeof updater === "function" ? updater(s[key]) : updater })),
  ];

  const addSystem = () => {
    const newLabel = `System ${systems.length + 1}`;
    setSystemsRaw((prev) => [...prev, makeBlankSystem(newLabel)]);
    setActiveIdxRaw(systems.length);
  };
  const removeSystem = (idx) => {
    if (systems.length <= 1) { askConfirm("At least one system is required.", null); return; }
    const label = systems[idx].label || `System ${idx + 1}`;
    askConfirm(`Remove "${label}"? This deletes everything entered for that system.`, () => {
      setSystemsRaw((prev) => prev.filter((_, i) => i !== idx));
      setActiveIdxRaw((prev) => {
        if (idx < prev) return prev - 1;
        if (idx === prev) return Math.max(0, prev - 1);
        return prev;
      });
    });
  };

  // Project Manager checklist (per system)
  const [pm, setPm] = sysState("pm");
  const [videoOpenSignal, setVideoOpenSignal] = useState(0);
  const goToVideoChecklist = () => {
    setVideoOpenSignal((n) => n + 1);
    setTimeout(() => { const el = document.getElementById("video-checklist"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
  };
  const [installers, setInstallers] = sysState("installers");
  const [equip, setEquip] = sysState("equip");

  // Installer roster (mechanics & helpers). Loaded from this browser's local
  // storage so additions/removals persist here without editing the app code.
  const loadRoster = () => {
    try {
      const raw = localStorage.getItem(ROSTER_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (Array.isArray(d.mechanics) && Array.isArray(d.helpers)) return d;
      }
    } catch { /* localStorage unavailable — fall back to defaults */ }
    return { mechanics: DEFAULT_MECHANICS, helpers: DEFAULT_HELPERS };
  };
  const [mechanics, setMechanics] = useState(() => loadRoster().mechanics);
  const [helpers, setHelpers] = useState(() => loadRoster().helpers);
  useEffect(() => {
    try { localStorage.setItem(ROSTER_KEY, JSON.stringify({ mechanics, helpers })); } catch { /* ignore */ }
  }, [mechanics, helpers]);
  const ALL_INSTALLERS = useMemo(() => [...mechanics, ...helpers], [mechanics, helpers]);
  const addRosterName = (list, setList, name) => {
    const n = name.trim();
    if (!n || list.includes(n)) return;
    setList([...list, n]);
  };
  const removeRosterName = (list, setList, name) => setList(list.filter((x) => x !== name));

  // portable loaner units to pick up (per system)
  const [portables, setPortables] = sysState("portables");
  const [portHeaters, setPortHeaters] = sysState("portHeaters");
  const [portAC, setPortAC] = sysState("portAC");
  const [portSource, setPortSource] = sysState("portSource"); // "Warehouse pull" or "Pick up from job"

  const [jobType, setJobType] = sysState("jobType");
  const [location, setLocation] = sysState("location");
  const flags = jobType ? deriveFlags(jobType) : {};
  const isAttic = /Attic/.test(location);

  // venting (gas only) — per system
  const [vent, setVent] = sysState("vent");      // "80" | "90"
  const [pvcQty, setPvcQty] = sysState("pvcQty"); // qty per PVC pipe size
  const [concentric, setConcentric] = sysState("concentric");          // "2" | "3" | "none"
  const [concentricQty, setConcentricQty] = sysState("concentricQty");

  // ladder (per system)
  const [atticLadder, setAtticLadder] = sysState("atticLadder");   // need ladder in attic?
  const [interiorAccess, setInteriorAccess] = sysState("interiorAccess");
  const [extLadderNeed, setExtLadderNeed] = sysState("extLadderNeed");
  const [extLadder, setExtLadder] = sysState("extLadder");

  // line set (per system)
  const [newLineSet, setNewLineSet] = sysState("newLineSet");
  const [lineSetSize, setLineSetSize] = sysState("lineSetSize");

  // gas — LP conversion kit (per system)
  const [lpKit, setLpKit] = sysState("lpKit");
  const [lpKitModel, setLpKitModel] = sysState("lpKitModel");

  // disconnect (per system)
  const [discIndoor, setDiscIndoor] = sysState("discIndoor");
  const [discOutdoor, setDiscOutdoor] = sysState("discOutdoor");

  // electrical: brand(s) + per-item {in,out} quantities (per system)
  const [elecBrands, setElecBrands] = sysState("elecBrands");
  const [elec, setElec] = sysState("elec"); // { "Title|item": { b1: n, b2: n } }
  const bumpElec = (key, side, delta) => setElec((p) => {
    const cur = { ...(p[key] || { b1: 0, b2: 0 }) };
    cur[side] = Math.max(0, (cur[side] || 0) + delta);
    if (!cur.b1 && !cur.b2) { const n = { ...p }; delete n[key]; return n; }
    return { ...p, [key]: cur };
  });

  // Supply grills: per size, separate Floor (split Brown/White) and Ceiling quantities (per system)
  const [supplyG, setSupplyG] = sysState("supplyG"); // { size: { floor: { brown: n, white: n }, ceiling: n } }
  const bumpSupplyG = (size, side, delta) => setSupplyG((p) => {
    const prev = p[size] || {};
    const cur = { floor: normFloor(prev.floor), ceiling: prev.ceiling || 0 };
    if (side === "ceiling") {
      cur.ceiling = Math.max(0, cur.ceiling + delta);
    } else {
      const colorKey = side === "floorBrown" ? "brown" : "white";
      cur.floor[colorKey] = Math.max(0, (cur.floor[colorKey] || 0) + delta);
    }
    if (!cur.floor.brown && !cur.floor.white && !cur.ceiling) { const n = { ...p }; delete n[size]; return n; }
    return { ...p, [size]: cur };
  });
  const [supplyGSpecial, setSupplyGSpecial] = sysState("supplyGSpecial");

  // Pre-made duct system wizard (per system)
  const [ductWizard, setDuctWizard] = sysState("ductWizard"); // null or { ton, step data }
  const [lastKit, setLastKit] = sysState("lastKit"); // remembers what the last kit added, for undo

  const auto = useMemo(() => {
    const s = autoBoxesFor(jobType);
    if (/Gas Furnace|Furnace Only|Gas Pack/.test(jobType) && vent === "90") s.add("90% Furnace PVC Job Box");
    return s;
  }, [jobType, vent]);
  const [extraBoxes, setExtraBoxes] = sysState("extraBoxes");
  // Zone workflow is active when the Zone System Job Box is pulled (auto or manually checked)
  const zoneActive = auto.has("Zone System Job Box") || extraBoxes.has("Zone System Job Box");
  // Duct Material Job Box active (auto or manually checked) → auto-adds 1 Duct Wrap
  const ductBoxActive = auto.has("Duct Material Job Box") || extraBoxes.has("Duct Material Job Box");
  const [zoneControl, setZoneControl] = sysState("zoneControl");
  const [zoneDampers, setZoneDampers] = sysState("zoneDampers"); // { size: qty }
  const [damperModel, setDamperModel] = sysState("damperModel");
  const setDamperQty = (size, q) => setZoneDampers((p) => {
    const cur = { ...p };
    if (q <= 0) delete cur[size]; else cur[size] = q;
    return cur;
  });

  const [sel, setSel] = sysState("sel");
  // free-text special sizes for boot sections, keyed by section key
  const [special, setSpecial] = sysState("special");
  const setSingle = (k, v) => setSel((p) => ({ ...p, [k]: p[k] === v ? "" : v }));
  const setQty = (k, item, q) => setSel((p) => {
    const cur = { ...(p[k] || {}) };
    if (q <= 0) delete cur[item]; else cur[item] = q;
    return { ...p, [k]: cur };
  });

  const [video, setVideo] = sysState("video");
  const toggleVideo = (i) => setVideo((p) => { const n = new Set(p); n.has(i) ? n.delete(i) : n.add(i); return n; });

  // Job notes (per system)
  const [notes, setNotes] = sysState("notes");

  // Timestamp for when this system's sheet was handed to the warehouse (per system)
  const [handoff, setHandoff] = sysState("handoff");
  const stampHandoff = () => {
    const d = new Date();
    setHandoff(d.toLocaleString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }));
  };

  // Who planned this job, and when
  const [plannedBy, setPlannedBy] = useState("");
  const [datePlanned, setDatePlanned] = useState("");
  const stampPlanned = () => {
    const d = new Date();
    setDatePlanned(d.toLocaleString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }));
  };

  /* ---------------- save / load progress ---------------- */
  const collectData = () => ({
    _format: "job-pull-sheet-v2",
    job, plannedBy, datePlanned, activeIdx,
    systems: systems.map((s) => ({ ...s, extraBoxes: [...s.extraBoxes], video: [...s.video] })),
  });

  const applyData = (d) => {
    if (!d) return false;
    if (d._format === "job-pull-sheet-v2" && Array.isArray(d.systems) && d.systems.length) {
      d.job && setJob(d.job);
      setPlannedBy(d.plannedBy || ""); setDatePlanned(d.datePlanned || "");
      const restored = d.systems.map((s, i) => ({
        ...makeBlankSystem(s.label || `System ${i + 1}`),
        ...s,
        extraBoxes: new Set(s.extraBoxes || []),
        video: new Set(s.video || []),
        pvcQty: s.pvcQty && typeof s.pvcQty === "object" ? { "2": s.pvcQty["2"] || "", "3": s.pvcQty["3"] || "" } : { "2": "", "3": "" },
      }));
      setSystemsRaw(restored);
      setActiveIdxRaw(Math.min(d.activeIdx || 0, restored.length - 1));
      return true;
    }
    // Legacy single-system saved files — load everything into one "System 1".
    if (d._format === "job-pull-sheet-v1") {
      d.job && setJob(d.job);
      setPlannedBy(d.plannedBy || ""); setDatePlanned(d.datePlanned || "");
      const sys = {
        ...makeBlankSystem("System 1"),
        pm: d.pm || makeBlankSystem().pm,
        installers: d.installers || ["", "", "", ""],
        equip: d.equip || { brand: "", orderDate: "", delivery: "", pickup: "" },
        portables: d.portables || "", portHeaters: d.portHeaters || "", portAC: d.portAC || "", portSource: d.portSource || "",
        jobType: d.jobType || "", location: d.location || "",
        vent: d.vent || "",
        pvcQty: d.pvcQty && typeof d.pvcQty === "object" ? { "2": d.pvcQty["2"] || "", "3": d.pvcQty["3"] || "" } : { "2": "", "3": "" },
        concentric: d.concentric || "2", concentricQty: d.concentricQty || "1",
        atticLadder: d.atticLadder || "", interiorAccess: d.interiorAccess || "",
        extLadderNeed: d.extLadderNeed || "", extLadder: d.extLadder || "",
        newLineSet: d.newLineSet || "", lineSetSize: d.lineSetSize || CATALOG.lineSetSizes[1],
        lpKit: d.lpKit || "", lpKitModel: d.lpKitModel || "",
        discIndoor: d.discIndoor || "", discOutdoor: d.discOutdoor || "",
        elecBrands: d.elecBrands || ["", ""], elec: d.elec || {},
        extraBoxes: new Set(d.extraBoxes || []),
        sel: d.sel || {}, special: d.special || {},
        supplyG: d.supplyG || {}, supplyGSpecial: d.supplyGSpecial || ["", ""],
        zoneControl: d.zoneControl || "", zoneDampers: d.zoneDampers || {}, damperModel: d.damperModel || "",
        lastKit: d.lastKit || null,
        video: new Set(d.video || []),
        handoff: d.handoff || "",
        notes: (d.job && d.job.notes) || "",
      };
      setSystemsRaw([sys]);
      setActiveIdxRaw(0);
      return true;
    }
    return false;
  };

  // On open, if this file was saved with data baked in, load it.
  useEffect(() => {
    const el = document.getElementById("saved-state");
    if (el && el.textContent.trim() && el.textContent.trim() !== "null") {
      try { applyData(JSON.parse(el.textContent)); } catch { /* ignore */ }
    }
  }, []);

  // When the Duct Material Job Box becomes active, default Duct Wrap to qty 1
  // (only on the transition into active; user can still change or zero it after).
  const [ductDefaulted, setDuctDefaulted] = sysState("ductDefaulted");
  useEffect(() => {
    if (ductBoxActive && !ductDefaulted) {
      setSel((p) => {
        const cur = { ...(p.ductWrap || {}) };
        if (!cur["Duct Wrap"]) cur["Duct Wrap"] = 1;
        return { ...p, ductWrap: cur };
      });
      setDuctDefaulted(true);
    } else if (!ductBoxActive && ductDefaulted) {
      setDuctDefaulted(false); // reset so it re-applies if the box is turned on again
    }
  }, [ductBoxActive, ductDefaulted]);

  // Zone control auto-pairs with its matching damper model (override still allowed).
  useEffect(() => {
    if (zoneControl.startsWith("ECONET RUUD")) setDamperModel("EWC Model # EURD");
    else if (zoneControl.startsWith("HARMONY 3")) setDamperModel("Honeywell Model # HARD");
  }, [zoneControl]);

  // Clear everything back to a fresh, blank job (all systems).
  const resetForm = () => {
    askConfirm("Clear this entire job (all systems) and start fresh? Anything not saved will be lost.", () => {
      setJob({ jobNo: "", customer: "", address: "", city: "", state: "", zip: "", phone: "", installDate: "" });
      setPlannedBy(""); setDatePlanned("");
      setSystemsRaw([makeBlankSystem("System 1")]);
      setActiveIdxRaw(0);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  };

  // Apply a pre-made duct system kit into the editable sections.
  // opts: { location: "Attic"|"Crawl Space", trunk, returnsNote, supplyRuns, toeSpace }
  const applyDuctKit = (ton, opts) => {
    const kit = DUCT_KITS[ton];
    if (!kit) return;
    const side = opts.location === "Crawl Space" ? "floor" : "ceiling";
    const grillCount = opts.supplyRuns && Number(opts.supplyRuns) > 0 ? Number(opts.supplyRuns) : Object.values(kit.supplyGrill)[0];
    const grillSize = opts.grillSize && opts.grillSize.trim() ? opts.grillSize.trim() : Object.keys(kit.supplyGrill)[0];
    const noteLine = `[${ton} duct system] ${opts.location || "?"} · ${opts.trunk || "?"} trunk` +
      (opts.returnsCount || opts.returnsNote ? ` · returns: ${opts.returnsCount || "?"}${opts.returnsNote ? " @ " + opts.returnsNote : ""}` : "") +
      (opts.supplyRuns ? ` · ${opts.supplyRuns} supply runs` : "") +
      (opts.toeSpace ? ` · toe-space: ${opts.toeSpace}` : "") +
      (opts.houseSize ? ` · house ${opts.houseSize}` : "");

    // Remember exactly what we add, so Undo can remove precisely this.
    // Build the record synchronously (NOT inside a setState updater).
    const sectionKeys = ["roundDuct", "straightBoot", "ninetyBoot", "sheetMetal", "reducer", "endCap", "saddleCollar", "flexSupply", "flexReturn", "aCollar"];
    const added = { sections: {}, grill: { size: grillSize, side, count: grillCount }, note: noteLine, ton };
    sectionKeys.forEach((key) => { if (kit[key]) added.sections[key] = { ...kit[key] }; });

    setSel((p) => {
      const next = { ...p };
      sectionKeys.forEach((key) => {
        if (!kit[key]) return;
        const cur = { ...(next[key] || {}) };
        Object.entries(kit[key]).forEach(([item, q]) => { cur[item] = (cur[item] || 0) + q; });
        next[key] = cur;
      });
      return next;
    });
    setSupplyG((p) => {
      const prev = p[grillSize] || {};
      const cur = { floor: normFloor(prev.floor), ceiling: prev.ceiling || 0 };
      if (side === "ceiling") cur.ceiling = (cur.ceiling || 0) + grillCount;
      else cur.floor.brown = (cur.floor.brown || 0) + grillCount; // defaults to Brown; adjust color below if needed
      return { ...p, [grillSize]: cur };
    });
    // Return grills → filter grills section (count + size from wizard)
    const returnCount = opts.returnsCount && Number(opts.returnsCount) > 0 ? Number(opts.returnsCount) : 0;
    const returnSize = opts.returnGrillSize && opts.returnGrillSize.trim() ? opts.returnGrillSize.trim() : "";
    if (returnCount > 0 && returnSize) {
      added.filterGrill = { size: returnSize, count: returnCount };
      setSel((p) => {
        const cur = { ...(p.filterGrills || {}) };
        cur[returnSize] = (cur[returnSize] || 0) + returnCount;
        return { ...p, filterGrills: cur };
      });
    }
    setExtraBoxes((p) => { const n = new Set(p); n.add("Duct Material Job Box"); return n; });
    setNotes((n) => (n ? n + "\n" : "") + noteLine);
    setLastKit(added);
    setDuctWizard(null);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  // Undo the last loaded duct kit — subtract exactly what it added.
  const undoDuctKit = () => {
    if (!lastKit || !lastKit.sections) { askConfirm("Nothing to undo.", null); return; }
    askConfirm(`Undo the ${lastKit.ton} duct kit? This removes the quantities it added.`, () => {
      setSel((p) => {
        const next = { ...p };
        Object.entries(lastKit.sections).forEach(([key, obj]) => {
          const cur = { ...(next[key] || {}) };
          Object.entries(obj).forEach(([item, q]) => {
            const remaining = (cur[item] || 0) - q;
            if (remaining > 0) cur[item] = remaining; else delete cur[item];
          });
          next[key] = cur;
        });
        return next;
      });
      setSupplyG((p) => {
        const { size, side, count } = lastKit.grill;
        const prev = p[size] || {};
        const cur = { floor: normFloor(prev.floor), ceiling: prev.ceiling || 0 };
        if (side === "ceiling") {
          cur.ceiling = Math.max(0, (cur.ceiling || 0) - count);
        } else {
          cur.floor.brown = Math.max(0, (cur.floor.brown || 0) - count);
        }
        if (!cur.floor.brown && !cur.floor.white && !cur.ceiling) { const n = { ...p }; delete n[size]; return n; }
        return { ...p, [size]: cur };
      });
      if (lastKit.filterGrill) {
        setSel((p) => {
          const cur = { ...(p.filterGrills || {}) };
          const { size, count } = lastKit.filterGrill;
          const remaining = (cur[size] || 0) - count;
          if (remaining > 0) cur[size] = remaining; else delete cur[size];
          return { ...p, filterGrills: cur };
        });
      }
      setNotes((n) => (n || "").split("\n").filter((l) => l !== lastKit.note).join("\n"));
      setLastKit(null);
    });
  };

  // source + current data (does NOT photograph the live, running page).
  const saveProgress = () => {
    const data = collectData();
    const source = document.getElementById("app-source")?.textContent || "";
    const safeData = JSON.stringify(data).replace(/</g, "\\u003c");
    const ST = "<" + "/script>"; // avoid closing the outer page's script
    const head =
      '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
      "<title>Job Information & Material Pull Sheet</title>\n" +
      '<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">' + ST + "\n" +
      '<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">' + ST + "\n" +
      '<script src="https://unpkg.com/@babel/standalone/babel.min.js">' + ST + "\n" +
      "<style>html,body,#root{height:100%;margin:0;}</style>\n</head>\n<body>\n" +
      '<div id="root"></div>\n<script id="saved-state" type="application/json">';
    const mid = ST + '\n<script id="app-source" type="text/babel" data-presets="react">';
    const tail = ST + "\n</body>\n</html>";
    const html = head + safeData + mid + source + tail;
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const tag = (job.customer || job.jobNo || "job").replace(/[^a-z0-9]+/gi, "-");
    a.href = url;
    a.download = `Pull-Sheet-${tag}.html`;
    a.click();
    URL.revokeObjectURL(url);
  };

  /* ---------------- pull list (for the currently active system) ---------------- */
  const pull = useMemo(() => buildPull(activeSystem), [activeSystem]);

  const totalLines = pull.reduce((n, gr) => n + gr.items.length, 0);

  const missing = [];
  if (!jobType) missing.push("job type");
  if (!location) missing.push("equipment location");
  if (flags.isGas && !vent) missing.push("venting (80/90)");
  if (flags.isGas && vent === "90" && !(Number(pvcQty["2"]) > 0 || Number(pvcQty["3"]) > 0)) missing.push("PVC qty");
  if (flags.isGas && !lpKit) missing.push("LP kit y/n");
  if (flags.isGas && lpKit === "yes" && !lpKitModel) missing.push("LP kit model #");
  if (isAttic && !atticLadder) missing.push("attic ladder y/n");
  if (!extLadderNeed) missing.push("extension ladder y/n");
  if (!newLineSet) missing.push("new line set y/n");

  // REQUIRED fields — the hard subset warned about (with override) before Save/Print.
  // Gas Pack vents through its own flue, so 80/90 + PVC are NOT required for it.
  const req = {
    customer: !job.customer.trim(),
    address: !job.address.trim(),
    installDate: !job.installDate,
    jobType: !jobType,
    location: !location,
    vent: flags.isGas && !flags.isGasPack && !vent,
    pvcQty: flags.isGas && !flags.isGasPack && vent === "90" && !(Number(pvcQty["2"]) > 0 || Number(pvcQty["3"]) > 0),
    lpKit: flags.isGas && !lpKit,
    lpKitModel: flags.isGas && lpKit === "yes" && !lpKitModel,
  };
  const reqLabels = {
    customer: "Customer", address: "Address", installDate: "Install Date",
    jobType: "Job Type", location: "Equipment Location", vent: "Venting (80/90)",
    pvcQty: "PVC Quantity", lpKit: "LP Kit y/n", lpKitModel: "LP Kit Model #",
  };
  const requiredMissing = Object.keys(req).filter((k) => req[k]).map((k) => reqLabels[k]);

  const guard = (action) => {
    if (requiredMissing.length === 0) { action(); return; }
    askConfirm("Missing required fields:\n\n• " + requiredMissing.join("\n• ") + "\n\nContinue anyway?", action);
  };

  // Merge a red outline onto an input when that required field is empty.
  const rq = (isMissing) => (isMissing ? { ...S.in, borderColor: "#c0392b", background: "#fff4f2" } : S.in);

  // Which system(s) to show when the browser print dialog opens.
  const [printTarget, setPrintTarget] = useState("current"); // "current" | "all"
  useEffect(() => {
    const reset = () => setPrintTarget("current");
    window.addEventListener("afterprint", reset);
    return () => window.removeEventListener("afterprint", reset);
  }, []);
  const printCurrent = () => { setPrintTarget("current"); setTimeout(() => window.print(), 50); };
  const printAllSystems = () => { setPrintTarget("all"); setTimeout(() => window.print(), 50); };

  const grouped = useMemo(() => {
    const out = {};
    SECTIONS.forEach((s) => { (out[s.group] = out[s.group] || []).push(s); });
    return out;
  }, []);

  return (
    <div style={S.page}>
      <style>{CSS}</style>

      {confirmDialog && (
        <div style={S.confirmOverlay} className="no-print">
          <div style={S.confirmBox}>
            <div style={S.confirmMsg}>{confirmDialog.message}</div>
            <div style={S.confirmBtns}>
              {confirmDialog.onConfirm && (
                <button type="button" style={S.clearBtn} onClick={() => setConfirmDialog(null)}>Cancel</button>
              )}
              <button
                type="button"
                style={S.saveBtn}
                onClick={() => {
                  const fn = confirmDialog.onConfirm;
                  setConfirmDialog(null);
                  if (fn) fn();
                }}
              >
                {confirmDialog.onConfirm ? "Confirm" : "OK"}
              </button>
            </div>
          </div>
        </div>
      )}

      <header style={S.topbar} className="no-print">
        <div style={S.brand}><span style={S.mark}>▲</span>JOB PLANNING &amp; MATERIAL PULL</div>
        <span style={S.sub}>Conditional Logic Build Sheet</span>
      </header>

      <div style={S.sysTabBar} className="no-print">
        {systems.map((s, i) => (
          <div key={i} style={{ ...S.sysTab, ...(i === activeIdx ? S.sysTabActive : {}) }}>
            <button type="button" style={S.sysTabBtn} onClick={() => setActiveIdxRaw(i)}>{s.label || `System ${i + 1}`}</button>
            {systems.length > 1 && (
              <button type="button" style={S.sysTabClose} title={`Remove ${s.label || `System ${i + 1}`}`} onClick={() => removeSystem(i)}>×</button>
            )}
          </div>
        ))}
        <button type="button" style={S.sysTabAdd} onClick={addSystem}>+ Add System</button>
        <div style={{ flex: 1, minWidth: 12 }} />
        <label style={S.sysRenameLabel}>
          <span style={S.fl}>Rename current system</span>
          <input style={{ ...S.in, width: 160 }} value={activeSystem.label || ""}
            onChange={(e) => updateSystemAt(activeIdx, (s) => ({ ...s, label: e.target.value }))}
            placeholder="e.g. 1st Floor Unit" />
        </label>
        {systems.length > 1 && (
          <button type="button" style={{ ...S.saveBtn, flexShrink: 0 }} onClick={() => guard(printAllSystems)}>⎙ Print All Systems ({systems.length})</button>
        )}
      </div>

      <div style={S.grid} className="layout-grid">
        {/* ============ LEFT: INPUTS ============ */}
        <section style={S.col} className="no-print">

          <Block n="1" title="Job Information">
            <Row>
              <Field l="Planned By"><input style={S.in} value={plannedBy} onChange={(e) => setPlannedBy(e.target.value)} /></Field>
              <Field l="Date Planned">
                <Row>
                  <button style={S.stampBtn} onClick={stampPlanned}>🕒 Stamp now</button>
                  {datePlanned && <button style={S.clearStamp} onClick={() => setDatePlanned("")}>Clear</button>}
                </Row>
                {datePlanned && <div style={S.stampShown}>{datePlanned}</div>}
              </Field>
            </Row>
            <Row>
              <Field l="Job #"><input style={S.in} value={job.jobNo} onChange={(e) => setJob({ ...job, jobNo: e.target.value })} /></Field>
              <Field l="Install Date"><input style={rq(req.installDate)} type="date" value={job.installDate} onChange={(e) => setJob({ ...job, installDate: e.target.value })} /></Field>
            </Row>
            <Row>
              <Field l="Customer"><input style={rq(req.customer)} value={job.customer} onChange={(e) => setJob({ ...job, customer: e.target.value })} /></Field>
              <Field l="Phone"><input style={S.in} value={job.phone} onChange={(e) => setJob({ ...job, phone: e.target.value })} /></Field>
            </Row>
            <Row>
              <Field l="Address"><input style={rq(req.address)} value={job.address} onChange={(e) => setJob({ ...job, address: e.target.value })} /></Field>
            </Row>
            <Row>
              <Field l="City"><input style={S.in} value={job.city} onChange={(e) => setJob({ ...job, city: e.target.value })} /></Field>
              <Field l="State"><input style={S.in} value={job.state || ""} onChange={(e) => setJob({ ...job, state: e.target.value })} /></Field>
              <Field l="Zip"><input style={S.in} value={job.zip} inputMode="numeric"
                onChange={(e) => {
                  const z = e.target.value;
                  setJob((j) => ({ ...j, zip: z }));
                  if (/^\d{5}$/.test(z)) {
                    fetch(`https://api.zippopotam.us/us/${z}`)
                      .then((r) => r.ok ? r.json() : null)
                      .then((d) => {
                        if (d && d.places && d.places[0]) {
                          const p = d.places[0];
                          setJob((j) => ({ ...j, zip: z, city: j.city || p["place name"], state: j.state || p["state abbreviation"] }));
                        }
                      })
                      .catch(() => { /* offline or not found — leave fields for manual entry */ });
                  }
                }} /></Field>
            </Row>
            <Row>
              {installers.map((v, i) => (
                <Field key={i} l={`Installer ${i + 1}`}>
                  <SelectOther value={v}
                    onChange={(val) => { const n = [...installers]; n[i] = val; setInstallers(n); }}
                    options={ALL_INSTALLERS}
                    groups={[{ label: "Mechanics", items: mechanics }, { label: "Helpers", items: helpers }]} />
                </Field>
              ))}
            </Row>
            <div style={S.subBox}>
              <Field l="Does this job need an electrician to run a new circuit?">
                <Pills v={pm.needElectrician} set={(v) => setPm({ ...pm, needElectrician: pm.needElectrician === v ? "" : v })} opts={["Yes", "No"]} />
              </Field>
              {pm.needElectrician === "Yes" && (
                <Field l="Did you call and set the install date with the electrical department?">
                  <Pills v={pm.electricianDateSet} set={(v) => setPm({ ...pm, electricianDateSet: pm.electricianDateSet === v ? "" : v })} opts={["Yes", "No"]} />
                </Field>
              )}
              <Field l="Does the homeowner want to keep any of the old equipment?">
                <Pills v={pm.keepOldEquip} set={(v) => setPm({ ...pm, keepOldEquip: pm.keepOldEquip === v ? "" : v })} opts={["Yes", "No"]} />
              </Field>
              {pm.keepOldEquip === "Yes" && (
                <Field l="What does the homeowner want to keep?">
                  <input style={S.in} value={pm.keepOldNote} onChange={(e) => setPm({ ...pm, keepOldNote: e.target.value })} placeholder="e.g. old condenser, copper line set" />
                </Field>
              )}
              <Field l="Did you upload your videos for this job?">
                <Pills v={pm.videosUploaded} set={(v) => setPm({ ...pm, videosUploaded: pm.videosUploaded === v ? "" : v })} opts={["Yes", "No"]} />
              </Field>
              {pm.videosUploaded === "Yes" && (
                <div style={{ marginTop: 8 }}>
                  <div style={S.note}>Check off what you uploaded to ServiceTitan.</div>
                  <button style={S.stampBtn} onClick={goToVideoChecklist}>↓ Go to video checklist (Section 9)</button>
                </div>
              )}
            </div>
            <div style={S.subBox}>
              <Field l="Did you leave any portable heaters or A/C units for the installers to pick up?">
                <Pills v={portables} set={setPortables} opts={[{ v: "yes", l: "Yes" }, { v: "no", l: "No" }]} />
              </Field>
              {portables === "yes" && (
                <>
                  <Row>
                    <Field l="Portable Heaters QTY"><input style={S.in} type="number" min="0" value={portHeaters} onChange={(e) => setPortHeaters(e.target.value)} /></Field>
                    <Field l="Portable A/C QTY"><input style={S.in} type="number" min="0" value={portAC} onChange={(e) => setPortAC(e.target.value)} /></Field>
                  </Row>
                  <Field l="Where do the portables come from?">
                    <Pills v={portSource} set={(v) => setPortSource(portSource === v ? "" : v)} opts={["Warehouse pull", "Pick up from job"]} />
                  </Field>
                </>
              )}
            </div>
            <Field l="Job Notes (this system)"><textarea style={{ ...S.in, minHeight: 50, resize: "vertical" }} value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>
          </Block>

          <Block n="1b" title="Manage Installer Roster" collapsible>
            <div style={S.note}>Add or remove names here — they update the Installer 1–4 dropdowns above right away. Saved in this browser, so it sticks around next time you open this tool here.</div>
            <Row>
              <RosterEditor label="Mechanics" names={mechanics}
                onAdd={(n) => addRosterName(mechanics, setMechanics, n)}
                onRemove={(n) => removeRosterName(mechanics, setMechanics, n)} />
              <RosterEditor label="Helpers" names={helpers}
                onAdd={(n) => addRosterName(helpers, setHelpers, n)}
                onRemove={(n) => removeRosterName(helpers, setHelpers, n)} />
            </Row>
          </Block>

          <Block n="2" title="Equipment & Logistics">
            <Row>
              <Field l="Equipment Brand">
                <SelectOther value={equip.brand} onChange={(v) => setEquip({ ...equip, brand: v })} options={EQUIP_BRANDS} />
              </Field>
              <Field l="Date Ordered"><input style={S.in} type="date" value={equip.orderDate} onChange={(e) => setEquip({ ...equip, orderDate: e.target.value })} /></Field>
            </Row>
            <Field l="Delivery">
              <Pills v={equip.delivery} set={(x) => setEquip({ ...equip, delivery: x })}
                opts={["Shop by 8am", "Job site", "At shop", "Installer pickup"]} wrap />
            </Field>
            {equip.delivery === "Installer pickup" && (
              <Field l="Pickup Location">
                <SelectOther value={equip.pickup} onChange={(v) => setEquip({ ...equip, pickup: v })} options={PICKUP_LOCATIONS} />
              </Field>
            )}
          </Block>

          <Block n="3" title="Job Type ▸ drives job boxes">
            <select style={rq(req.jobType)} value={jobType} onChange={(e) => setJobType(e.target.value)}>
              <option value="">— Select job type —</option>
              {JOB_TYPES.map((t) => <option key={t}>{t}</option>)}
            </select>
            {jobType && (
              <div style={S.auto}>
                ✔ Auto-pulls: {[...auto].join(", ")}
                {flags.isGas && <div style={S.flag}>⚑ Gas job — pick venting in step 5</div>}
              </div>
            )}
          </Block>

          <Block n="3b" title="Pre-Made Duct System (optional)" collapsible>
            <div style={S.note}>Pick a tonnage to load a base duct kit. Answer a few questions, then adjust anything in the sections below.</div>
            <div style={S.pills}>
              {DUCT_KIT_TONS.map((t) => (
                <button key={t} style={{ ...S.pill, ...(ductWizard?.ton === t ? S.pillOn : {}) }}
                  onClick={() => setDuctWizard({ ton: t, location: location || "", trunk: "", returnsCount: "", returnsNote: "", returnGrillSize: "", supplyRuns: "", grillSize: "", toeSpace: "", houseSize: "" })}>
                  {t}
                </button>
              ))}
            </div>
            {lastKit && !ductWizard && (
              <div style={{ marginTop: 10 }}>
                <div style={S.auto}>✔ Loaded: {lastKit.ton} duct kit</div>
                <button style={S.clearBtn} onClick={undoDuctKit}>↶ Undo {lastKit.ton} kit</button>
              </div>
            )}
            {ductWizard && (
              <div style={S.subBox}>
                <div style={S.auto}>Building a {ductWizard.ton} duct system</div>
                <Field l="Q1 · Duct location (sets Floor vs Ceiling grills)">
                  <Pills v={ductWizard.location} set={(v) => setDuctWizard({ ...ductWizard, location: v })} opts={["Attic", "Crawl Space"]} />
                </Field>
                <Field l="Q2 · House width & length">
                  <input style={S.in} value={ductWizard.houseSize} onChange={(e) => setDuctWizard({ ...ductWizard, houseSize: e.target.value })} placeholder="e.g. 40 x 60" />
                </Field>
                <Field l="Q3 · Trunk line">
                  <Pills v={ductWizard.trunk} set={(v) => setDuctWizard({ ...ductWizard, trunk: v })} opts={["Straight", "Tee"]} />
                </Field>
                {ductWizard.trunk === "Tee" && <div style={S.flag}>⚑ Tee trunk — adjust trunk/fittings in the sections after loading.</div>}
                <Field l="Q4 · Returns">
                  <Row>
                    <Field l="How many"><input style={S.in} type="number" min="0" value={ductWizard.returnsCount} onChange={(e) => setDuctWizard({ ...ductWizard, returnsCount: e.target.value })} placeholder="qty" /></Field>
                    <Field l="Notes (optional)"><input style={S.in} value={ductWizard.returnsNote} onChange={(e) => setDuctWizard({ ...ductWizard, returnsNote: e.target.value })} placeholder="any notes" /></Field>
                  </Row>
                  <div style={{ marginTop: 8 }}>
                    <span style={S.fl}>Return / Filter grill size</span>
                    <Pills v={ductWizard.returnGrillSize} set={(v) => setDuctWizard({ ...ductWizard, returnGrillSize: ductWizard.returnGrillSize === v ? "" : v })} opts={CATALOG.filterGrills} wrap />
                  </div>
                </Field>
                <Field l="Q5 · How many supply runs?">
                  <input style={S.in} type="number" min="0" value={ductWizard.supplyRuns} onChange={(e) => setDuctWizard({ ...ductWizard, supplyRuns: e.target.value })} placeholder="grill count (blank = kit default)" />
                </Field>
                <Field l="Q6 · What size are the supply grills?">
                  <Pills v={ductWizard.grillSize} set={(v) => setDuctWizard({ ...ductWizard, grillSize: ductWizard.grillSize === v ? "" : v })} opts={CATALOG.supplyGrills} wrap />
                  <div style={S.note}>Blank = kit default ({Object.keys(DUCT_KITS[ductWizard.ton].supplyGrill)[0]})</div>
                </Field>
                <Field l="Q7 · Any toe-space registers? How many?">
                  <input style={S.in} value={ductWizard.toeSpace} onChange={(e) => setDuctWizard({ ...ductWizard, toeSpace: e.target.value })} placeholder="e.g. 2, or none" />
                </Field>
                <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                  <button style={S.stampBtn} onClick={() => applyDuctKit(ductWizard.ton, ductWizard)}>✓ Load {ductWizard.ton} kit</button>
                  <button style={S.clearStamp} onClick={() => setDuctWizard(null)}>Cancel</button>
                </div>
              </div>
            )}
          </Block>

          <Block n="4" title="Equipment Location">
            <select style={rq(req.location)} value={location} onChange={(e) => setLocation(e.target.value)}>
              <option value="">— Select location —</option>
              {LOCATIONS.map((l) => <option key={l}>{l}</option>)}
            </select>
            {isAttic && (
              <div style={S.subBox}>
                <Field l="Attic install — do we need a ladder?">
                  <Pills v={atticLadder} set={setAtticLadder} opts={[{ v: "yes", l: "Yes" }, { v: "no", l: "No" }]} />
                </Field>
                {atticLadder === "yes" && (
                  <Field l="Access type / ladder size">
                    <Pills v={interiorAccess} set={setInteriorAccess} opts={INTERIOR_ACCESS} wrap />
                  </Field>
                )}
              </div>
            )}
          </Block>

          {flags.isGas && (
            <Block n="5" title="Venting (gas)">
              {flags.isGasPack && <div style={S.auto}>Gas Pack vents through its own flue — 80/90 &amp; PVC not required.</div>}
              <Pills v={vent} set={setVent} opts={[{ v: "80", l: "80% — B-Vent" }, { v: "90", l: "90% — PVC" }]} />
              {req.vent && <div style={S.reqHint}>● Required</div>}
              {vent === "80" && <div style={S.auto}>Add a B-Vent job box in step 7 (Metal Fab or Hart &amp; Cooley)</div>}
              {vent === "90" && (
                <div style={S.subBox}>
                  <div style={S.auto}>✔ Pulls 90% Furnace PVC Job Box + add-ons</div>
                  <Field l="PVC Pipe QTY (10ft sticks, by size)">
                    <Row>
                      <Field l={'2" PVC'}><input style={rq(req.pvcQty)} type="number" min="0" value={pvcQty["2"]} onChange={(e) => setPvcQty((p) => ({ ...p, "2": e.target.value }))} /></Field>
                      <Field l={'3" PVC'}><input style={rq(req.pvcQty)} type="number" min="0" value={pvcQty["3"]} onChange={(e) => setPvcQty((p) => ({ ...p, "3": e.target.value }))} /></Field>
                    </Row>
                  </Field>
                  <Row>
                    <Field l="Concentric kit"><Pills v={concentric} set={setConcentric} opts={[{ v: "2", l: '2"' }, { v: "3", l: '3"' }, { v: "none", l: "Not Needed" }]} /></Field>
                    {concentric !== "none" && (
                      <Field l="Concentric QTY"><input style={S.in} type="number" min="1" value={concentricQty} onChange={(e) => setConcentricQty(e.target.value)} /></Field>
                    )}
                  </Row>
                </div>
              )}
              <div style={S.subBox}>
                <Field l="Does it need an LP Kit?">
                  <Pills v={lpKit} set={setLpKit} opts={[{ v: "yes", l: "Yes" }, { v: "no", l: "No" }]} />
                </Field>
                {req.lpKit && <div style={S.reqHint}>● Required</div>}
                {lpKit === "yes" && (
                  <>
                    <Field l="LP Kit model # (to pull / order)">
                      <input style={rq(req.lpKitModel)} value={lpKitModel} onChange={(e) => setLpKitModel(e.target.value)} placeholder="Enter model number" />
                    </Field>
                    <div style={S.auto}>✔ Pulls: LP Conversion Kit{lpKitModel ? ` — ${lpKitModel}` : ""}</div>
                  </>
                )}
              </div>
            </Block>
          )}

          <Block n="6" title="Line Set & Extension Ladder" collapsible>
            <Field l="Running a new line set?">
              <Pills v={newLineSet} set={setNewLineSet} opts={[{ v: "yes", l: "Yes" }, { v: "no", l: "No" }]} />
            </Field>
            {newLineSet === "yes" && (
              <Field l="Line set size">
                <SelectOther value={lineSetSize} onChange={setLineSetSize} options={CATALOG.lineSetSizes} />
              </Field>
            )}
            <Field l="Need an extension ladder?">
              <Pills v={extLadderNeed} set={setExtLadderNeed} opts={[{ v: "yes", l: "Yes" }, { v: "no", l: "No" }]} />
            </Field>
            {extLadderNeed === "yes" && (
              <Field l="Extension ladder size"><Pills v={extLadder} set={setExtLadder} opts={EXT_LADDERS} wrap /></Field>
            )}
          </Block>

          <Block n="7" title="Job Boxes" collapsible>
            <div style={S.chkGrid}>
              {CATALOG.jobBoxes.map((b) => {
                const locked = auto.has(b);
                const checked = locked || extraBoxes.has(b);
                return (
                  <label key={b} style={{ ...S.chk, opacity: locked ? 0.85 : 1 }}>
                    <input type="checkbox" checked={checked} disabled={locked}
                      onChange={(e) => setExtraBoxes((p) => { const n = new Set(p); e.target.checked ? n.add(b) : n.delete(b); return n; })} />
                    {b}{locked && <span style={S.lockTag}>auto</span>}
                  </label>
                );
              })}
            </div>
          </Block>

          {zoneActive && (
            <Block n="7b" title="Zone System — Control &amp; Dampers">
              <div style={S.auto}>✔ Zone System Job Box selected — pick the control and dampers.</div>
              <Field l="Zone Control">
                <Pills v={zoneControl} set={(v) => setZoneControl(zoneControl === v ? "" : v)} opts={CATALOG.zoneControls} wrap />
              </Field>
              <div style={S.secWrap}>
                <div style={S.secTitle}>Zone Dampers</div>
                <div style={S.qtyGrid}>
                  {CATALOG.zoneDampers.map((size) => {
                    const q = zoneDampers[size] || 0;
                    return (
                      <div key={size} style={{ ...S.qtyItem, ...(q ? S.qtyOn : {}) }}>
                        <button style={S.step} onClick={() => setDamperQty(size, q - 1)}>−</button>
                        <span style={S.qtyN}>{q}</span>
                        <button style={S.step} onClick={() => setDamperQty(size, q + 1)}>+</button>
                        <span style={S.qtyLbl}>{size}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
              <Field l="Damper Model">
                <Pills v={damperModel}
                  set={(v) => setDamperModel(damperModel === v ? "" : v)}
                  opts={["EWC Model # EURD", "Honeywell Model # HARD"]} wrap />
              </Field>
            </Block>
          )}

          <Block n="8" title="Disconnect / Load Center" collapsible>
            <Row>
              <Field l="Indoor QTY"><input style={S.in} type="number" min="0" value={discIndoor} onChange={(e) => setDiscIndoor(e.target.value)} /></Field>
              <Field l="Outdoor QTY"><input style={S.in} type="number" min="0" value={discOutdoor} onChange={(e) => setDiscOutdoor(e.target.value)} /></Field>
            </Row>
          </Block>

          <Block n="9" title="Electrical — Brand 1 / Brand 2" collapsible>
            <Row>
              {elecBrands.map((v, i) => (
                <Field key={i} l={`Breaker Brand ${i + 1}`}>
                  <select style={S.in} value={v} onChange={(e) => { const n = [...elecBrands]; n[i] = e.target.value; setElecBrands(n); }}>
                    <option value="">—</option>{CATALOG.breakerBrands.map((b) => <option key={b}>{b}</option>)}
                  </select>
                </Field>
              ))}
            </Row>
            {ELEC_SECTIONS.map((s) => (
              <div key={s.key} style={S.secWrap}>
                <div style={S.elecHead}>
                  <span>{s.title}</span>
                  <span style={S.elecCols}>
                    <span>{elecBrands[0] ? elecBrands[0].split(" ")[0] : "BR 1"}</span>
                    <span>{elecBrands[1] ? elecBrands[1].split(" ")[0] : "BR 2"}</span>
                  </span>
                </div>
                {CATALOG[s.cat].map((item) => {
                  const q = elec[`${s.title}|${item}`] || { b1: 0, b2: 0 };
                  const on = q.b1 || q.b2;
                  return (
                    <div key={item} style={{ ...S.elecRow, ...(on ? S.qtyOn : {}) }}>
                      <span style={S.elecLbl}>{item}</span>
                      <Stepper q={q.b1} onMinus={() => bumpElec(`${s.title}|${item}`, "b1", -1)} onPlus={() => bumpElec(`${s.title}|${item}`, "b1", 1)} />
                      <Stepper q={q.b2} onMinus={() => bumpElec(`${s.title}|${item}`, "b2", -1)} onPlus={() => bumpElec(`${s.title}|${item}`, "b2", 1)} />
                    </div>
                  );
                })}
              </div>
            ))}
          </Block>


          {Object.entries(grouped).map(([group, secs]) => (
            <Block key={group} n="•" title={group} collapsible>
              {secs.map((s) => (
                <div key={s.key} style={S.secWrap}>
                  <div style={S.secTitle}>{s.title}</div>
                  {s.mode === "single"
                    ? <Pills v={sel[s.key] || ""} set={(val) => setSingle(s.key, val)} opts={CATALOG[s.cat]} wrap />
                    : <div style={S.qtyGrid}>{CATALOG[s.cat].map((item) => {
                        const q = (sel[s.key] || {})[item] || 0;
                        return (
                          <div key={item} style={{ ...S.qtyItem, ...(q ? S.qtyOn : {}) }}>
                            <button style={S.step} onClick={() => setQty(s.key, item, q - 1)}>−</button>
                            <span style={S.qtyN}>{q}</span>
                            <button style={S.step} onClick={() => setQty(s.key, item, q + 1)}>+</button>
                            <span style={S.qtyLbl}>{displayLabel(item)}</span>
                          </div>);
                      })}</div>}
                  {s.special && (
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginTop: 6 }}>
                      {Array.from({ length: s.specialCount || 2 }, (_, i) => i).map((i) => (
                        <input key={i} style={S.in} value={(special[s.key] || [])[i] || ""}
                          onChange={(e) => setSpecial((p) => {
                            const arr = [...(p[s.key] || Array(s.specialCount || 2).fill(""))];
                            arr[i] = e.target.value;
                            return { ...p, [s.key]: arr };
                          })}
                          placeholder={`Special ${s.key === "thermostats" ? "model" : "size"} ${i + 1}`} />
                      ))}
                    </div>
                  )}
                </div>
              ))}
              {group === "Air Distribution" && (
                <div style={S.secWrap}>
                  <div style={S.secTitle}>Supply Grill — Floor (Brown / White) / Ceiling</div>
                  <div style={S.elecHead}>
                    <span>Size</span>
                    <span style={S.elecCols}><span>FLOOR · BROWN</span><span>FLOOR · WHITE</span><span>CEIL</span></span>
                  </div>
                  {CATALOG.supplyGrills.map((size) => {
                    const raw = supplyG[size] || {};
                    const floor = normFloor(raw.floor);
                    const ceiling = raw.ceiling || 0;
                    const on = floor.brown || floor.white || ceiling;
                    return (
                      <div key={size} style={{ ...S.elecRow, gridTemplateColumns: "1fr auto auto auto", ...(on ? S.qtyOn : {}) }}>
                        <span style={S.elecLbl}>{size}</span>
                        <Stepper q={floor.brown} onMinus={() => bumpSupplyG(size, "floorBrown", -1)} onPlus={() => bumpSupplyG(size, "floorBrown", 1)} />
                        <Stepper q={floor.white} onMinus={() => bumpSupplyG(size, "floorWhite", -1)} onPlus={() => bumpSupplyG(size, "floorWhite", 1)} />
                        <Stepper q={ceiling} onMinus={() => bumpSupplyG(size, "ceiling", -1)} onPlus={() => bumpSupplyG(size, "ceiling", 1)} />
                      </div>
                    );
                  })}
                  <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                    {[0, 1].map((i) => (
                      <input key={i} style={S.in} value={supplyGSpecial[i] || ""}
                        onChange={(e) => setSupplyGSpecial((p) => { const n = [...p]; n[i] = e.target.value; return n; })}
                        placeholder={`Special size ${i + 1}`} />
                    ))}
                  </div>
                </div>
              )}
            </Block>
          ))}

          <Block n="9" title="What's Needed in Video" collapsible openSignal={videoOpenSignal} id="video-checklist">
            {Object.entries(VIDEO_CHECKLIST).map(([cat, items]) => (
              <div key={cat} style={S.secWrap}>
                <div style={S.secTitle}>{cat}</div>
                <div style={S.chkGrid}>
                  {items.map((it) => {
                    const id = cat + "|" + it;
                    return <label key={id} style={S.chk}><input type="checkbox" checked={video.has(id)} onChange={() => toggleVideo(id)} />{it}</label>;
                  })}
                </div>
              </div>
            ))}
          </Block>

          <Block n="10" title="Handed to Warehouse">
            <Row>
              <button style={S.stampBtn} onClick={stampHandoff}>🕒 Stamp now</button>
              {handoff && <button style={S.clearStamp} onClick={() => setHandoff("")}>Clear</button>}
            </Row>
            {handoff
              ? <div style={S.stampShown}>Handed over: {handoff}</div>
              : <div style={S.note}>Tap when you hand the sheet to the warehouse.</div>}
          </Block>
        </section>

        {/* ============ RIGHT: OUTPUT SHEET(S) ============ */}
        <section style={S.sheet} className="sheet-panel">
          {systems.map((s, i) => (
            <div key={i}
              className={printTarget === "all" ? "sheet-instance force-print-block" : "sheet-instance"}
              style={{ display: i === activeIdx ? "block" : "none" }}>
              <PrintSheet
                sys={s}
                job={job}
                plannedBy={plannedBy}
                datePlanned={datePlanned}
                interactive={i === activeIdx}
                missing={i === activeIdx ? missing : []}
                systemCount={systems.length}
                onClear={resetForm}
                onSave={() => guard(saveProgress)}
                onPrint={() => guard(printCurrent)}
                onPrintAll={() => guard(printAllSystems)}
              />
            </div>
          ))}
        </section>
      </div>
    </div>
  );
}

/* ---------- printed sheet for a single system (used once per system) ---------- */
const PrintSheet = ({ sys, job, plannedBy, datePlanned, interactive, missing, systemCount, onClear, onSave, onPrint, onPrintAll }) => {
  const flags = deriveFlags(sys.jobType || "");
  const isAttic = /Attic/.test(sys.location || "");
  const pull = useMemo(() => buildPull(sys), [sys]);
  const totalLines = pull.reduce((n, gr) => n + gr.items.length, 0);
  const equipUnits = equipmentUnitsFor(sys.jobType);

  return (
    <>
      <div style={S.sheetHead}>
        <div>
          <div style={S.sheetTitle}>JOB INFORMATION &amp; MATERIAL PULL SHEET</div>
          <div style={S.meta}>
            Planned by: {plannedBy ? <span style={S.crewName}>{plannedBy}</span> : "—"}{datePlanned ? ` · ${datePlanned}` : ""}<br />
            Job #{job.jobNo || "—"} · {job.customer || "—"}{job.phone ? ` · ${job.phone}` : ""}<br />
            {job.address || "—"}{job.city ? `, ${job.city}` : ""}{job.state ? `, ${job.state}` : ""} {job.zip}<br />
            System: <b>{sys.label || "—"}</b> · {sys.jobType || "no job type"} · {sys.location || "no location"}<br />
            Install {job.installDate || "—"} · {sys.equip.brand || "—"} · {totalLines} line items<br />
            Crew: {sys.installers.filter(Boolean).length
              ? sys.installers.filter(Boolean).map((nm, i) => <span key={i} style={S.crewName}>{nm}</span>)
              : "—"}
            {sys.handoff && <><br /><span style={S.handoffStamp}>🕒 Handed to warehouse: {sys.handoff}</span></>}
          </div>
        </div>
        {interactive && (
          <div style={S.btnRow} className="no-print">
            <button style={S.clearBtn} onClick={onClear}>✕ Clear</button>
            <button style={S.saveBtn} onClick={onSave}>💾 Save</button>
            <button style={S.print} onClick={onPrint}>⎙ Print This System</button>
            {systemCount > 1 && <button style={S.saveBtn} onClick={onPrintAll}>⎙ Print All ({systemCount})</button>}
          </div>
        )}
      </div>

      {interactive && missing.length > 0 && <div style={S.warn} className="no-print">Still needed: {missing.join(", ")}.</div>}

      {(sys.pm.needElectrician || sys.pm.keepOldEquip || sys.pm.videosUploaded) && (
        <>
          <div style={S.secLabel}>▣ PROJECT MANAGER</div>
          <div style={S.spec}>
            {sys.pm.needElectrician && <SL k="Electrician for new circuit" v={sys.pm.needElectrician + (sys.pm.needElectrician === "Yes" ? ` · install date set: ${sys.pm.electricianDateSet || "?"}` : "")} />}
            {sys.pm.keepOldEquip && <SL k="Keep old equipment" v={sys.pm.keepOldEquip + (sys.pm.keepOldEquip === "Yes" && sys.pm.keepOldNote ? `: ${sys.pm.keepOldNote}` : "")} />}
            {sys.pm.videosUploaded && <SL k="Videos uploaded to ServiceTitan" v={sys.pm.videosUploaded} />}
          </div>
        </>
      )}

      {sys.notes && (<><div style={{ ...S.secLabel, marginTop: (sys.pm.needElectrician || sys.pm.keepOldEquip || sys.pm.videosUploaded) ? 18 : 0 }}>▣ JOB NOTES</div><div style={S.notesBox}>{sys.notes}</div></>)}

      <div style={{ ...S.secLabel, marginTop: (sys.pm.needElectrician || sys.pm.keepOldEquip || sys.pm.videosUploaded || sys.notes) ? 18 : 0 }}>▣ WAREHOUSE — PULL LIST</div>
      {pull.length === 0 && <div style={S.empty}>Pick a job type to start building the list.</div>}
      {pull.map((g) => (
        <div key={g.group} style={S.pg}>
          <div style={S.pgTitle}>{g.group}</div>
          {g.items.map((it, i) => {
            const pn = extractPart(it.item);
            return (
              <div key={it.item + i} style={S.pi}>
                <span style={S.box}>☐</span><span style={S.qtyChip}>{it.qty}</span>
                <span style={{ flex: 1 }}>
                  {renderItem(it.item)}
                  {pn && <span style={S.bcWrap}><Barcode value={pn} /><span style={S.bcText}>{pn}</span></span>}
                </span>
              </div>
            );
          })}
        </div>
      ))}

      <div style={{ ...S.secLabel, marginTop: 18 }}>▣ WAREHOUSE — RECORD MODEL &amp; SERIAL #</div>
      <div style={S.msNote}>Write the model &amp; serial for each unit below, OR peel the sticker from the equipment and place it in the box.</div>
      {equipUnits.length === 0 && <div style={S.empty}>Pick a job type to list the equipment.</div>}
      {equipUnits.map((unit) => (
        <div key={unit} style={S.msUnit} className="ms-unit">
          <div style={S.msUnitName}>{unit}</div>
          <div style={S.msRow}>
            <div style={S.msLines}>
              <div style={S.msLine}><span style={S.msLbl}>Model #</span><span style={S.msWrite}></span></div>
              <div style={S.msLine}><span style={S.msLbl}>Serial #</span><span style={S.msWrite}></span></div>
            </div>
            <div style={S.msSticker}>Place sticker here</div>
          </div>
        </div>
      ))}

      <div style={{ ...S.secLabel, marginTop: 18 }}>▣ INSTALLER JOB SPEC</div>
      <div style={S.spec}>
        <SL k="Job Type" v={sys.jobType || "—"} />
        <SL k="Location" v={sys.location || "—"} />
        <SL k="Brand" v={sys.equip.brand || "—"} />
        <SL k="Venting" v={!flags.isGas ? "n/a" : sys.vent === "80" ? "80% B-Vent" : sys.vent === "90" ? `90% PVC — ${["2", "3"].filter((s) => Number(sys.pvcQty[s]) > 0).map((s) => `${s}"×${sys.pvcQty[s]}`).join(", ") || "qty?"}${sys.concentric === "none" ? " · no concentric kit" : ` + ${sys.concentric}" conc. ×${sys.concentricQty || 1}`}` : "—"} />
        <SL k="LP Kit" v={!flags.isGas ? "n/a" : sys.lpKit === "yes" ? `Yes${sys.lpKitModel ? ` — ${sys.lpKitModel}` : " (model?)"}` : sys.lpKit === "no" ? "No" : "—"} />
        <SL k="Line Set" v={sys.newLineSet === "yes" ? sys.lineSetSize : sys.newLineSet === "no" ? "Reuse existing" : "—"} />
        <SL k="Attic Access" v={isAttic ? (sys.atticLadder === "yes" ? sys.interiorAccess || "ladder needed" : "no ladder") : "n/a"} />
        <SL k="Ext. Ladder" v={sys.extLadderNeed === "yes" ? sys.extLadder || "yes" : "no"} />
        <SL k="Thermostat" v={(() => {
          const picks = Object.entries(sys.sel.thermostats || {}).map(([m, q]) => `${m} ×${q}`);
          const specials = (sys.special.thermostats || []).filter((s) => s?.trim()).map((s) => s.trim());
          return [...picks, ...specials].join(", ") || "—";
        })()} />
        <SL k="Portables" v={sys.portables !== "yes" ? "None" : (() => {
          const parts = [];
          if (Number(sys.portHeaters) > 0) parts.push(`${sys.portHeaters} Portable Heater${Number(sys.portHeaters) > 1 ? "s" : ""}`);
          if (Number(sys.portAC) > 0) parts.push(`${sys.portAC} Portable A/C${Number(sys.portAC) > 1 ? " units" : ""}`);
          const where = sys.portSource ? ` — ${sys.portSource}` : "";
          return parts.length ? parts.join(", ") + where : "Yes (qty?)";
        })()} />
        <SL k="Delivery" v={sys.equip.delivery ? sys.equip.delivery + (sys.equip.pickup ? ` (${sys.equip.pickup})` : "") : "—"} />
      </div>

      {sys.video.size > 0 && (
        <>
          <div style={{ ...S.secLabel, marginTop: 18 }}>▣ VIDEO / PHOTO CHECKLIST</div>
          <div style={S.spec}>
            {[...sys.video].map((id) => {
              const [cat, it] = id.split("|");
              return <div key={id} style={S.pi}><span style={S.box}>☐</span><span style={{ color: "#9a968c", fontSize: 11 }}>{cat}</span> {it}</div>;
            })}
          </div>
        </>
      )}
    </>
  );
};
const Block = ({ n, title, children, collapsible, openSignal, id }) => {
  const [open, setOpen] = useState(!collapsible);
  useEffect(() => { if (openSignal) setOpen(true); }, [openSignal]);
  return (
    <div style={S.block} id={id}>
      <div style={{ ...S.bHead, cursor: collapsible ? "pointer" : "default" }} onClick={collapsible ? () => setOpen(!open) : undefined}>
        <span style={S.bNum}>{n}</span>{title}{collapsible && <span style={S.caret}>{open ? "▾" : "▸"}</span>}
      </div>
      {open && children}
    </div>
  );
};
const Row = ({ children }) => <div style={S.row}>{children}</div>;
const Stepper = ({ q, onMinus, onPlus }) => (
  <span style={S.stepper}>
    <button style={S.step} onClick={onMinus}>−</button>
    <span style={S.qtyN}>{q}</span>
    <button style={S.step} onClick={onPlus}>+</button>
  </span>
);
const Field = ({ l, children }) => <label style={S.field}><span style={S.fl}>{l}</span>{children}</label>;
const SL = ({ k, v }) => <div style={S.sl}><span style={S.slk}>{k}</span><span style={S.slv}>{v}</span></div>;

// Editable name list for the installer roster (add via text box, remove via ×).
const RosterEditor = ({ label, names, onAdd, onRemove }) => {
  const [text, setText] = useState("");
  const submit = () => { onAdd(text); setText(""); };
  return (
    <div style={{ flex: 1, minWidth: 220 }}>
      <div style={S.fl}>{label}</div>
      <div style={S.pills}>
        {names.map((n) => (
          <span key={n} style={{ ...S.pill, display: "inline-flex", alignItems: "center", gap: 6, cursor: "default" }}>
            {n}
            <button type="button" title={`Remove ${n}`} onClick={() => onRemove(n)}
              style={{ border: "none", background: "transparent", color: "inherit", cursor: "pointer", fontWeight: 700, fontSize: 13, lineHeight: 1, padding: 0 }}>×</button>
          </span>
        ))}
        {names.length === 0 && <span style={S.note}>None yet.</span>}
      </div>
      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
        <input style={{ ...S.in, flex: 1 }} value={text} placeholder={`Add a ${label.toLowerCase().slice(0, -1)}…`}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } }} />
        <button type="button" style={S.stampBtn} onClick={submit}>+ Add</button>
      </div>
    </div>
  );
};

// Pull a trailing "(PARTNUMBER)" out of an item label, if present.
const extractPart = (text) => {
  const m = text.match(/\(([^)]+)\)\s*$/);
  return m ? m[1] : null;
};

// --- Code 128 (subset B) barcode → SVG. Self-contained, no library needed. ---
const CODE128_PATTERNS = ["11011001100","11001101100","11001100110","10010011000","10010001100","10001001100","10011001000","10011000100","10001100100","11001001000","11001000100","11000100100","10110011100","10011011100","10011001110","10111001100","10011101100","10011100110","11001110010","11001011100","11001001110","11011100100","11001110100","11101101110","11101001100","11100101100","11100100110","11101100100","11100110100","11100110010","11011011000","11011000110","11000110110","10100011000","10001011000","10001000110","10110001000","10001101000","10001100010","11010001000","11000101000","11000100010","10110111000","10110001110","10001101110","10111011000","10111000110","10001110110","11101110110","11010001110","11000101110","11011101000","11011100010","11011101110","11101011000","11101000110","11100010110","11101101000","11101100010","11100011010","11101111010","11001000010","11110001010","10100110000","10100001100","10010110000","10010000110","10000101100","10000100110","10110010000","10110000100","10011010000","10011000010","10000110100","10000110010","11000010010","11001010000","11110111010","11000010100","10001111010","10100111100","10010111100","10010011110","10111100100","10011110100","10011110010","11110100100","11110010100","11110010010","11011011110","11011110110","11110110110","10101111000","10100011110","10001011110","10111101000","10111100010","11110101000","11110100010","10111011110","10111101110","11101011110","11110101110","11010000100","11010010000","11010011100","11000111010"];
const code128B = (text) => {
  // START B = 104, checksum, then STOP (106) + final bar "11"
  const codes = [104];
  let sum = 104;
  for (let i = 0; i < text.length; i++) {
    const val = text.charCodeAt(i) - 32; // subset B maps ASCII 32.. to 0..
    if (val < 0 || val > 94) continue;   // skip unsupported chars
    codes.push(val);
    sum += val * (i + 1);
  }
  codes.push(sum % 103); // checksum
  codes.push(106);       // stop
  let bits = codes.map((c) => CODE128_PATTERNS[c]).join("") + "11";
  return bits;
};
const Barcode = ({ value, height = 34 }) => {
  if (!value) return null;
  const bits = code128B(value);
  const bw = 1.1; // bar unit width (px)
  const rects = [];
  let x = 0;
  for (let i = 0; i < bits.length; i++) {
    if (bits[i] === "1") rects.push(<rect key={i} x={x} y="0" width={bw} height={height} fill="#000" />);
    x += bw;
  }
  return (
    <svg width={x} height={height} className="barcode" style={{ display: "block" }}
      viewBox={`0 0 ${x} ${height}`} shapeRendering="crispEdges">{rects}</svg>
  );
};

// Render a pull-list item, bolding a trailing "(PARTNUMBER)" so the warehouse spots it.
const renderItem = (text) => {
  const m = text.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  if (!m) return text;
  return <>{m[1]} (<strong>{m[2]}</strong>)</>;
};

// In the selection UI, show only the size/description — hide the "(PARTNUMBER)".
// The full string (with part number) still flows to the pull sheet.
const displayLabel = (text) => {
  const m = text.match(/^(.*?)\s*\([^)]+\)\s*$/);
  return m ? m[1] : text;
};

const Pills = ({ v, set, opts, suf = "", wrap }) => (
  <div style={S.pills}>
    {opts.map((o) => {
      const val = typeof o === "string" ? o : o.v;
      const lbl = typeof o === "string" ? displayLabel(o) + suf : o.l;
      const on = v === val;
      return <button key={val} onClick={() => set(val)} style={{ ...S.pill, ...(on ? S.pillOn : {}) }}>{lbl}</button>;
    })}
  </div>
);

// Dropdown with an "Other — type it in" escape hatch.
// When "Other" is active, the SAME space becomes a text box (with a ↩ to return to the list).
const SelectOther = ({ value, onChange, options, groups }) => {
  const inList = options.includes(value);
  const isCustom = value !== "" && !inList;        // a typed-in value
  const typing = isCustom || value === "__other__";
  if (typing) {
    return (
      <div style={{ display: "flex", gap: 6 }}>
        <input style={{ ...S.in, flex: 1 }} autoFocus value={value === "__other__" ? "" : value}
          onChange={(e) => onChange(e.target.value)} placeholder="Type it in" />
        <button style={S.backBtn} title="Back to list" onClick={() => onChange("")}>↩</button>
      </div>
    );
  }
  return (
    <select style={S.in} value={value} onChange={(e) => onChange(e.target.value)}>
      <option value="">—</option>
      {groups
        ? groups.map((g) => <optgroup key={g.label} label={g.label}>{g.items.map((o) => <option key={o}>{o}</option>)}</optgroup>)
        : options.map((o) => <option key={o}>{o}</option>)}
      <option value="__other__">Other — type it in</option>
    </select>
  );
};
